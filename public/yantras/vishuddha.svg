  <!-- 16 Matrika Vowels in Devanagari: अं to अः -->
  <g font-family="'Noto Sans Devanagari', 'Mangal', 'Yatra One', 'Sanskrit', serif" font-size="22" font-weight="bold" fill="url(#bronzeMain)" text-anchor="middle" dominant-baseline="central">
    
      <circle cx="500.0" cy="115.6" r="18" fill="#FFF9EB" stroke="url(#goldAccent)" stroke-width="1.4" />
      <text x="500.0" y="116.6">अं</text>
    
      <circle cx="647.1" cy="144.9" r="18" fill="#FFF9EB" stroke="url(#goldAccent)" stroke-width="1.4" />
      <text x="647.1" y="145.9">आं</text>
    
      <circle cx="771.8" cy="228.2" r="18" fill="#FFF9EB" stroke="url(#goldAccent)" stroke-width="1.4" />
      <text x="771.8" y="229.2">इं</text>
    
      <circle cx="855.1" cy="352.9" r="18" fill="#FFF9EB" stroke="url(#goldAccent)" stroke-width="1.4" />
      <text x="855.1" y="353.9">ईं</text>
    
      <circle cx="884.4" cy="500.0" r="18" fill="#FFF9EB" stroke="url(#goldAccent)" stroke-width="1.4" />
      <text x="884.4" y="501.0">उं</text>
    
      <circle cx="855.1" cy="647.1" r="18" fill="#FFF9EB" stroke="url(#goldAccent)" stroke-width="1.4" />
      <text x="855.1" y="648.1">ऊं</text>
    
      <circle cx="771.8" cy="771.8" r="18" fill="#FFF9EB" stroke="url(#goldAccent)" stroke-width="1.4" />
      <text x="771.8" y="772.8">ऋं</text>
    
      <circle cx="647.1" cy="855.1" r="18" fill="#FFF9EB" stroke="url(#goldAccent)" stroke-width="1.4" />
      <text x="647.1" y="856.1">ॠं</text>
    
      <circle cx="500.0" cy="884.4" r="18" fill="#FFF9EB" stroke="url(#goldAccent)" stroke-width="1.4" />
      <text x="500.0" y="885.4">ऌं</text>
    
      <circle cx="352.9" cy="855.1" r="18" fill="#FFF9EB" stroke="url(#goldAccent)" stroke-width="1.4" />
      <text x="352.9" y="856.1">ॡं</text>
    
      <circle cx="228.2" cy="771.8" r="18" fill="#FFF9EB" stroke="url(#goldAccent)" stroke-width="1.4" />
      <text x="228.2" y="772.8">एं</text>
    
      <circle cx="144.9" cy="647.1" r="18" fill="#FFF9EB" stroke="url(#goldAccent)" stroke-width="1.4" />
      <text x="144.9" y="648.1">ऐं</text>
    
      <circle cx="115.6" cy="500.0" r="18" fill="#FFF9EB" stroke="url(#goldAccent)" stroke-width="1.4" />
      <text x="115.6" y="501.0">ओं</text>
    
      <circle cx="144.9" cy="352.9" r="18" fill="#FFF9EB" stroke="url(#goldAccent)" stroke-width="1.4" />
      <text x="144.9" y="353.9">औं</text>
    
      <circle cx="228.2" cy="228.2" r="18" fill="#FFF9EB" stroke="url(#goldAccent)" stroke-width="1.4" />
      <text x="228.2" y="229.2">अं</text>
    
      <circle cx="352.9" cy="144.9" r="18" fill="#FFF9EB" stroke="url(#goldAccent)" stroke-width="1.4" />
      <text x="352.9" y="145.9">अः</text>
    
  </g>

  <!-- Akasha Tattva Mandala: Pure Circular Mandala like Full Moon (पूर्णचन्द्र मण्डल / वृत्त) -->
  <g id="akashaMandala">
    <circle cx="500" cy="500" r="225" fill="#FFFFFF" fill-opacity="0.82" stroke="url(#bronzeMain)" stroke-width="3" />
    <circle cx="500" cy="500" r="212" fill="none" stroke="url(#goldAccent)" stroke-width="1.6" stroke-dasharray="5 3" />
    <circle cx="500" cy="500" r="200" fill="none" stroke="url(#bronzeMain)" stroke-width="1.4" />

    <!-- Inverted Triangle / Silver Crescent inside Akasha Circle -->
    <polygon points="500,590 590,440 410,440" fill="none" stroke="url(#bronzeMain)" stroke-width="2.4" />
    <polygon points="500,572 576,450 424,450" fill="none" stroke="url(#goldAccent)" stroke-width="1.2" />

    <!-- Pure Nectar Drop (अमृत बिन्दु) -->
    <circle cx="500" cy="510" r="14" fill="url(#goldAccent)" stroke="url(#bronzeMain)" stroke-width="1.5" />
  </g>

  <!-- White Airavata Elephant (शुक्ल गज) Motif -->
  <g id="whiteElephant" opacity="0.85">
    <ellipse cx="500" cy="565" rx="55" ry="12" fill="#E0E0E0" stroke="url(#bronzeMain)" stroke-width="1.4" />
  </g>

  <!-- Central Beeja: हं (Akasha Beeja 'Ham') -->
  <g id="centralBeeja">
    <circle cx="500" cy="410" r="48" fill="#FFFDF8" stroke="url(#bronzeMain)" stroke-width="2.6" />
    <circle cx="500" cy="410" r="42" fill="none" stroke="url(#goldAccent)" stroke-width="1.4" stroke-dasharray="3 2" />
    <text x="500" y="426" font-family="'Noto Sans Devanagari', 'Mangal', 'Yatra One', serif" font-size="46" font-weight="bold" fill="url(#bronzeMain)" text-anchor="middle">हं</text>
  </g>

  <!-- Inner Shastric Identification -->
  <text x="500" y="775" font-family="'Noto Sans Devanagari', 'Mangal', serif" font-size="20" font-weight="bold" fill="url(#bronzeMain)" text-anchor="middle" letter-spacing="1">विशुद्ध चक्र • आकाश तत्त्व (पूर्णचन्द्र मण्डल)</text>
  <text x="500" y="800" font-family="'Noto Sans Devanagari', 'Mangal', serif" font-size="14" fill="#6B4B03" text-anchor="middle">शाकिणी शक्ति • पञ्चमुख सदाशिव • श्वेत ऐरावत</text>
</svg>
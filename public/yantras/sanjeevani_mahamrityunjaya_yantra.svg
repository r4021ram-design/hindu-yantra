    <path d="M 370.00 274.83 L 307.50 166.58" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.6" />
  </g>

  <!-- 12 Amrita Seeds Inscription -->
  <g id="amrita_seeds" font-family="'Noto Sans Devanagari', serif" font-weight="700" font-size="16" fill="#1A0E05" text-anchor="middle" dominant-baseline="central">
    <text x="500.0" y="172.0">हौं</text>
    <text x="664.0" y="215.9">जूं</text>
    <text x="784.1" y="336.0">सः</text>
    <text x="828.0" y="500.0">भूर्</text>
    <text x="784.1" y="664.0">भुवः</text>
    <text x="664.0" y="784.1">स्वः</text>
    <text x="500.0" y="828.0">त्र्यं</text>
    <text x="336.0" y="784.1">बकं</text>
    <text x="215.9" y="664.0">यजा</text>
    <text x="172.0" y="500.0">महे</text>
    <text x="215.9" y="336.0">सुगन्धिं</text>
    <text x="336.0" y="215.9">पुष्टि</text>
  </g>

  <!-- Intermediate Girdles -->
  <circle cx="500" cy="500" r="260" stroke="url(#bronzeMain)" stroke-width="2.4" fill="none" />
  <circle cx="500" cy="500" r="250" stroke="url(#bronzeMain)" stroke-width="1.6" fill="none" />

  <!-- 4. Inner Ashta-Dala Lotus (अष्टदल पद्म - अष्टमूर्ति शिव मण्डल) -->

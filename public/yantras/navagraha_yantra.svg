    <text x="620" y="516" text-anchor="middle" font-family="'Cinzel', monospace" font-size="9.5" font-weight="bold" fill="#8C2300">योग २१</text>
  

    <!-- बुध (Merc) -->
    <circle cx="500" cy="360" r="38" fill="#EDF7EE" stroke="url(#bronzeMain)" stroke-width="2.4" />
    <text x="500" y="356" text-anchor="middle" font-family="'Cinzel Decorative', 'Noto Sans Devanagari', serif" font-size="16" font-weight="900" fill="#1A0E05">बुध</text>
    <text x="500" y="376" text-anchor="middle" font-family="'Cinzel', monospace" font-size="9.5" font-weight="bold" fill="#8C2300">योग २४</text>
  

    <!-- गुरु (Jup) -->
    <circle cx="620" cy="380" r="38" fill="#FFFDE8" stroke="url(#bronzeMain)" stroke-width="2.4" />
    <text x="620" y="376" text-anchor="middle" font-family="'Cinzel Decorative', 'Noto Sans Devanagari', serif" font-size="16" font-weight="900" fill="#1A0E05">गुरु</text>
    <text x="620" y="396" text-anchor="middle" font-family="'Cinzel', monospace" font-size="9.5" font-weight="bold" fill="#8C2300">योग २७</text>
  

    <!-- शुक्र (Venus) -->
    <circle cx="500" cy="640" r="38" fill="#F8F4FF" stroke="url(#bronzeMain)" stroke-width="2.4" />
    <text x="500" y="636" text-anchor="middle" font-family="'Cinzel Decorative', 'Noto Sans Devanagari', serif" font-size="16" font-weight="900" fill="#1A0E05">शुक्र</text>
    <text x="500" y="656" text-anchor="middle" font-family="'Cinzel', monospace" font-size="9.5" font-weight="bold" fill="#8C2300">योग ३०</text>
  

    <!-- शनि (Sat) -->
    <circle cx="380" cy="500" r="38" fill="#F2F2F2" stroke="url(#bronzeMain)" stroke-width="2.4" />
    <text x="380" y="496" text-anchor="middle" font-family="'Cinzel Decorative', 'Noto Sans Devanagari', serif" font-size="16" font-weight="900" fill="#1A0E05">शनि</text>
    <text x="380" y="516" text-anchor="middle" font-family="'Cinzel', monospace" font-size="9.5" font-weight="bold" fill="#8C2300">योग ३३</text>
  

    <!-- राहु (Rahu) -->
    <circle cx="380" cy="620" r="38" fill="#EAEAEA" stroke="url(#bronzeMain)" stroke-width="2.4" />
    <text x="380" y="616" text-anchor="middle" font-family="'Cinzel Decorative', 'Noto Sans Devanagari', serif" font-size="16" font-weight="900" fill="#1A0E05">राहु</text>
    <text x="380" y="636" text-anchor="middle" font-family="'Cinzel', monospace" font-size="9.5" font-weight="bold" fill="#8C2300">योग ३६</text>
  

    <!-- केतु (Ketu) -->
    <circle cx="620" cy="620" r="38" fill="#F7EFE5" stroke="url(#bronzeMain)" stroke-width="2.4" />
    <text x="620" y="616" text-anchor="middle" font-family="'Cinzel Decorative', 'Noto Sans Devanagari', serif" font-size="16" font-weight="900" fill="#1A0E05">केतु</text>
    <text x="620" y="636" text-anchor="middle" font-family="'Cinzel', monospace" font-size="9.5" font-weight="bold" fill="#8C2300">योग ३९</text>
  
  </g>

  <!-- Central Solar Aura -->
  <circle cx="500" cy="500" r="14" fill="#8C2300" stroke="#1A0E05" stroke-width="2.5" />

</svg>
  <!-- Inner Mandala Ring -->
  <circle cx="500" cy="500" r="235" stroke="url(#bronzeMain)" stroke-width="2.8" fill="none" />

  <!-- Directional Radial Ray Separators -->
  <g id="mandala-rays" stroke="url(#bronzeMain)" stroke-width="1.8" opacity="0.6">
    <line x1="500" y1="265" x2="500" y2="735" />
    <line x1="265" y1="500" x2="735" y2="500" />
    <line x1="334" y1="334" x2="666" y2="666" />
    <line x1="334" y1="666" x2="666" y2="334" />
  </g>

  <!-- 9 Planetary Shrine Nodes (Navagraha Shanti Cells) -->
  <g id="navagraha-sanctums">

    <!-- सूर्य (Sun) -->
    <circle cx="500" cy="500" r="48" fill="#FAF3E8" stroke="url(#bronzeMain)" stroke-width="2.4" />
    <text x="500" y="496" text-anchor="middle" font-family="'Cinzel Decorative', 'Noto Sans Devanagari', serif" font-size="20" font-weight="900" fill="#1A0E05">सूर्य</text>
    <text x="500" y="516" text-anchor="middle" font-family="'Cinzel', monospace" font-size="11" font-weight="bold" fill="#8C2300">योग १५</text>
  

    <!-- चन्द्र (Moon) -->
    <circle cx="380" cy="380" r="38" fill="#FFFFFF" stroke="url(#bronzeMain)" stroke-width="2.4" />
    <text x="380" y="376" text-anchor="middle" font-family="'Cinzel Decorative', 'Noto Sans Devanagari', serif" font-size="16" font-weight="900" fill="#1A0E05">चन्द्र</text>
    <text x="380" y="396" text-anchor="middle" font-family="'Cinzel', monospace" font-size="9.5" font-weight="bold" fill="#8C2300">योग १८</text>
  

    <!-- मंगल (Mars) -->
    <circle cx="620" cy="500" r="38" fill="#FFF1ED" stroke="url(#bronzeMain)" stroke-width="2.4" />

    <path d="M 558.53 794.24 C 560.53 831.42, 517.54 856.97, 500.00 882.00 C 482.46 856.97, 439.47 831.42, 441.47 794.24" stroke-width="2.4" />
    <path d="M 441.47 794.24 C 429.09 829.35, 379.60 836.51, 353.81 852.92 C 347.19 823.09, 317.25 783.03, 333.33 749.44" stroke-width="2.4" />
    <path d="M 333.33 749.44 C 308.45 777.15, 259.98 764.82, 229.89 770.11 C 235.18 740.02, 222.85 691.55, 250.56 666.67" stroke-width="2.4" />
    <path d="M 250.56 666.67 C 216.97 682.75, 176.91 652.81, 147.08 646.19 C 163.49 620.40, 170.65 570.91, 205.76 558.53" stroke-width="2.4" />
    <path d="M 205.76 558.53 C 168.58 560.53, 143.03 517.54, 118.00 500.00 C 143.03 482.46, 168.58 439.47, 205.76 441.47" stroke-width="2.4" />
    <path d="M 205.76 441.47 C 170.65 429.09, 163.49 379.60, 147.08 353.81 C 176.91 347.19, 216.97 317.25, 250.56 333.33" stroke-width="2.4" />
    <path d="M 250.56 333.33 C 222.85 308.45, 235.18 259.98, 229.89 229.89 C 259.98 235.18, 308.45 222.85, 333.33 250.56" stroke-width="2.4" />
    <path d="M 333.33 250.56 C 317.25 216.97, 347.19 176.91, 353.81 147.08 C 379.60 163.49, 429.09 170.65, 441.47 205.76" stroke-width="2.4" />
  </g>

  <!-- Intermediate Ring -->
  <circle cx="500" cy="500" r="300" stroke="url(#lakshmiBronze)" stroke-width="2.6" fill="none" />

  <!-- 4. Canonical Ashtadala Padma (8 Inner Ogee Lotus Petals of Ashta-Lakshmi) -->
  <g id="lakshmi-inner-lotus" stroke="url(#lakshmiBronze)" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 419.64 305.99 C 411.45 265.67, 473.24 228.31, 500.00 200.00 C 526.76 228.31, 588.55 265.67, 580.36 305.99" stroke-width="2.6" />
    <line x1="500.00" y1="290.00" x2="500.00" y2="200.00" stroke-width="1.6" opacity="0.75" />

    <path d="M 580.36 305.99 C 603.08 271.69, 673.19 288.97, 712.13 287.87 C 711.03 326.81, 728.31 396.92, 694.01 419.64" stroke-width="2.6" />
    <line x1="648.49" y1="351.51" x2="712.13" y2="287.87" stroke-width="1.6" opacity="0.75" />

    <path d="M 694.01 419.64 C 734.33 411.45, 771.69 473.24, 800.00 500.00 C 771.69 526.76, 734.33 588.55, 694.01 580.36" stroke-width="2.6" />
    <line x1="710.00" y1="500.00" x2="800.00" y2="500.00" stroke-width="1.6" opacity="0.75" />

    <path d="M 694.01 580.36 C 728.31 603.08, 711.03 673.19, 712.13 712.13 C 673.19 711.03, 603.08 728.31, 580.36 694.01" stroke-width="2.6" />
    <line x1="648.49" y1="648.49" x2="712.13" y2="712.13" stroke-width="1.6" opacity="0.75" />

    <path d="M 580.36 694.01 C 588.55 734.33, 526.76 771.69, 500.00 800.00 C 473.24 771.69, 411.45 734.33, 419.64 694.01" stroke-width="2.6" />
    <line x1="500.00" y1="710.00" x2="500.00" y2="800.00" stroke-width="1.6" opacity="0.75" />

    <path d="M 419.64 694.01 C 396.92 728.31, 326.81 711.03, 287.87 712.13 C 288.97 673.19, 271.69 603.08, 305.99 580.36" stroke-width="2.6" />
    <line x1="351.51" y1="648.49" x2="287.87" y2="712.13" stroke-width="1.6" opacity="0.75" />

    <path d="M 305.99 580.36 C 265.67 588.55, 228.31 526.76, 200.00 500.00 C 228.31 473.24, 265.67 411.45, 305.99 419.64" stroke-width="2.6" />
    <line x1="290.00" y1="500.00" x2="200.00" y2="500.00" stroke-width="1.6" opacity="0.75" />

    <path d="M 305.99 419.64 C 271.69 396.92, 288.97 326.81, 287.87 287.87 C 326.81 288.97, 396.92 271.69, 419.64 305.99" stroke-width="2.6" />
    <line x1="351.51" y1="351.51" x2="287.87" y2="287.87" stroke-width="1.6" opacity="0.75" />
  </g>

  <!-- Ring Enclosing Shatkona -->
  <circle cx="500" cy="500" r="210" stroke="url(#lakshmiBronze)" stroke-width="2.6" fill="none" />

  <!-- 5. Sacred Shatkona (Interlocking Shiva-Shakti Hexagram of Absolute Auspiciousness) -->
  <g id="lakshmi-shatkona" stroke="url(#lakshmiBronze)" stroke-width="2.8" fill="none">
    <!-- Upward Shiva Triangle -->
    <polygon points="500,310 335,595 665,595" />
    <!-- Downward Shakti Triangle -->
    <polygon points="500,690 335,405 665,405" />
  </g>

  <!-- Central Inner Ring -->
  <circle cx="500" cy="500" r="75" stroke="url(#lakshmiBronze)" stroke-width="2.2" fill="none" />

  <!-- 6. Sacred Beejakshara & Supreme Bindu -->
  <circle cx="500" cy="500" r="16" fill="#8C2300" opacity="0.2" className="animate-pulse" />
  <circle cx="500" cy="500" r="8" fill="#4D0E00" stroke="#1A0E05" stroke-width="2" />

  <!-- Shreem Beejakshara Inscription -->
  <text x="500" y="475" text-anchor="middle" fill="#0F0C08" font-size="26" font-family="'Cinzel', serif" font-weight="900">श्रीं</text>
  <text x="500" y="538" text-anchor="middle" fill="#541B08" font-size="14" font-family="'Cinzel', serif" font-weight="bold">महालक्ष्म्यै नमः</text>
</svg>

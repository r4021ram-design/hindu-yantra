  <!-- Hexagram Vertex Inscriptions: रां रामाय नमः -->
  <g id="shatkona_rama_texts" font-family="'Noto Sans Devanagari', serif" font-weight="900" font-size="14.5" fill="#78350F" text-anchor="middle" dominant-baseline="central">

    <!-- Square 1 -->
    <rect x="400" y="400" width="200" height="200" />
    <!-- Square 2 (Rotated 45 deg) -->
    <rect x="400" y="400" width="200" height="200" transform="rotate(45 500 500)" />
  </g>


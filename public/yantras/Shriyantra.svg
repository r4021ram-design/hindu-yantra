<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="sriGoldMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#8B6508" />
    </linearGradient>
    <linearGradient id="sriGoldAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="50%" stop-color="#E5C158" />
      <stop offset="100%" stop-color="#C59B27" />
    </linearGradient>
    <radialGradient id="binduRadiance" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FFE875" />
      <stop offset="70%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#D4AF37" />
    </radialGradient>
  </defs>

  <!-- 1. BHUPURA (EARTH RAMPART & 4 PORTALS) -->
  <g id="avarana_1_bhupura" stroke="url(#sriGoldMain)" stroke-width="2.2" fill="none" stroke-linejoin="round">
    <path id="bhupura_outer_quad" d="M 60 60 L 420.8 60 L 420.8 24.8 L 579.2 24.8 L 579.2 60 L 940 60 L 940 420.8 L 975.2 420.8 L 975.2 579.2 L 940 579.2 L 940 940 L 579.2 940 L 579.2 975.2 L 420.8 975.2 L 420.8 940 L 60 940 L 60 579.2 L 24.8 579.2 L 24.8 420.8 L 60 420.8 Z M 79.8 79.8 L 440.6 79.8 L 440.6 44.6 L 559.4 44.6 L 559.4 79.8 L 920.2 79.8 L 920.2 440.6 L 955.4 440.6 L 955.4 559.4 L 920.2 559.4 L 920.2 920.2 L 559.4 920.2 L 559.4 955.4 L 440.6 955.4 L 440.6 920.2 L 79.8 920.2 L 79.8 559.4 L 44.6 559.4 L 44.6 440.6 L 79.8 440.6 Z M 99.6 99.6 L 460.4 99.6 L 460.4 64.4 L 539.6 64.4 L 539.6 99.6 L 900.4 99.6 L 900.4 460.4 L 935.6 460.4 L 935.6 539.6 L 900.4 539.6 L 900.4 900.4 L 539.6 900.4 L 539.6 935.6 L 460.4 935.6 L 460.4 900.4 L 99.6 900.4 L 99.6 539.6 L 64.4 539.6 L 64.4 460.4 L 99.6 460.4 Z" />
  </g>

  <!-- 2. OUTER CONCENTRIC CIRCLE RINGS -->
  <g id="transition_outer_circles" stroke="url(#sriGoldAccent)" stroke-width="1.8" fill="none">
    <circle cx="500" cy="500" r="400" />
    <circle cx="500" cy="500" r="392" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6" />
  </g>

  <!-- 3. SHODASHA DALA (16 LOTUS PETALS) -->
  <g id="avarana_2_shodashadala" stroke="url(#sriGoldMain)" stroke-width="2.2" fill="rgba(212,175,55,0.08)" stroke-linejoin="round">
    <path id="lotus_16_petals" d="M 436.4 180.26 Q 459.01 128.74, 500 108 Q 540.99 128.74, 563.6 180.26 M 563.6 180.26 Q 604.21 141.31, 650.01 137.84 Q 679.94 172.68, 681.12 228.94 M 681.12 228.94 Q 733.54 208.49, 777.19 222.81 Q 791.51 266.46, 771.06 318.88 M 771.06 318.88 Q 827.32 320.06, 862.16 349.99 Q 858.69 395.79, 819.74 436.4 M 819.74 436.4 Q 871.26 459.01, 892 500 Q 871.26 540.99, 819.74 563.6 M 819.74 563.6 Q 858.69 604.21, 862.16 650.01 Q 827.32 679.94, 771.06 681.12 M 771.06 681.12 Q 791.51 733.54, 777.19 777.19 Q 733.54 791.51, 681.12 771.06 M 681.12 771.06 Q 679.94 827.32, 650.01 862.16 Q 604.21 858.69, 563.6 819.74 M 563.6 819.74 Q 540.99 871.26, 500 892 Q 459.01 871.26, 436.4 819.74 M 436.4 819.74 Q 395.79 858.69, 349.99 862.16 Q 320.06 827.32, 318.88 771.06 M 318.88 771.06 Q 266.46 791.51, 222.81 777.19 Q 208.49 733.54, 228.94 681.12 M 228.94 681.12 Q 172.68 679.94, 137.84 650.01 Q 141.31 604.21, 180.26 563.6 M 180.26 563.6 Q 128.74 540.99, 108 500 Q 128.74 459.01, 180.26 436.4 M 180.26 436.4 Q 141.31 395.79, 137.84 349.99 Q 172.68 320.06, 228.94 318.88 M 228.94 318.88 Q 208.49 266.46, 222.81 222.81 Q 266.46 208.49, 318.88 228.94 M 318.88 228.94 Q 320.06 172.68, 349.99 137.84 Q 395.79 141.31, 436.4 180.26 " />
  </g>

  <!-- 4. MIDDLE CONCENTRIC CIRCLE RINGS -->
  <g id="transition_middle_circles" stroke="url(#sriGoldAccent)" stroke-width="1.8" fill="none">
    <circle cx="500" cy="500" r="326" />
    <circle cx="500" cy="500" r="320" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6" />
  </g>

  <!-- 5. ASHTA DALA (8 LOTUS PETALS) -->
  <g id="avarana_3_ashtadala" stroke="url(#sriGoldMain)" stroke-width="2.2" fill="rgba(217,119,6,0.12)" stroke-linejoin="round">
    <path id="lotus_8_petals" d="M 402.03 263.49 Q 434.1 205.2, 500 180 Q 565.9 205.2, 597.97 263.49 M 597.97 263.49 Q 661.86 244.95, 726.27 273.73 Q 755.05 338.14, 736.51 402.03 M 736.51 402.03 Q 794.8 434.1, 820 500 Q 794.8 565.9, 736.51 597.97 M 736.51 597.97 Q 755.05 661.86, 726.27 726.27 Q 661.86 755.05, 597.97 736.51 M 597.97 736.51 Q 565.9 794.8, 500 820 Q 434.1 794.8, 402.03 736.51 M 402.03 736.51 Q 338.14 755.05, 273.73 726.27 Q 244.95 661.86, 263.49 597.97 M 263.49 597.97 Q 205.2 565.9, 180 500 Q 205.2 434.1, 263.49 402.03 M 263.49 402.03 Q 244.95 338.14, 273.73 273.73 Q 338.14 244.95, 402.03 263.49 " />
  </g>

  <!-- 6. INNER CONCENTRIC CIRCLE RINGS (ENCLOSING ALL 9 TRIANGLES WITH ZERO OVERFLOW) -->
  <g id="transition_inner_circles" stroke="url(#sriGoldAccent)" stroke-width="2" fill="none">
    <circle cx="500" cy="500" r="256" />
    <circle cx="500" cy="500" r="250" stroke-width="2.2" stroke="url(#sriGoldMain)" />
  </g>

  <!-- 7. THE SACRED 9 INTERLOCKING SHIVA-SHAKTI PRIMARY TRIANGLES (NAVAYONI) -->
  <!-- Scaled with absolute precision so all vertices touch and stay inside r=250 -->
  <g id="navayoni_interlocking_triangles" stroke="url(#sriGoldMain)" stroke-width="2.2" stroke-linejoin="miter">
    <!-- 4 Upward Shiva Triangles (Purusha) -->
    <path id="primary_tri_U1" d="M 257.46 560.62 L 742.54 560.62 L 500 250 Z" fill="rgba(212,175,55,0.08)" />
    <path id="primary_tri_U2" d="M 320.66 619.81 L 679.34 619.81 L 500 320.27 Z" fill="rgba(212,175,55,0.08)" />
    <path id="primary_tri_U3" d="M 371.79 675.09 L 628.21 675.09 L 500 433.02 Z" fill="rgba(212,175,55,0.08)" />
    <path id="primary_tri_U4" d="M 412.38 526.65 L 587.63 526.65 L 500 382.81 Z" fill="rgba(212,175,55,0.08)" />

    <!-- 5 Downward Shakti Triangles (Prakriti) -->
    <path id="primary_tri_D1" d="M 259.14 433.02 L 740.86 433.02 L 500 750 Z" fill="rgba(245,158,11,0.09)" />
    <path id="primary_tri_D2" d="M 327.46 382.81 L 672.54 382.81 L 500 675.09 Z" fill="rgba(245,158,11,0.09)" />
    <path id="primary_tri_D3" d="M 351.22 320.27 L 648.78 320.27 L 500 526.65 Z" fill="rgba(245,158,11,0.09)" />
    <path id="primary_tri_D4" d="M 415.88 460.77 L 584.13 460.77 L 500 619.81 Z" fill="rgba(245,158,11,0.09)" />
    
    <!-- 5th Downward Shakti Triangle (Kamakala Mula Trikona) -->
    <path id="primary_tri_D5_central" d="M 436.53 486.99 L 563.47 486.99 L 500 560.62 Z" fill="rgba(245,158,11,0.09)" />
  </g>

  <!-- 8. CENTRAL BINDU (MAHABINDU SINGULARITY) -->
  <g id="avarana_9_bindu">
    <circle cx="500" cy="500" r="11" fill="none" stroke="url(#sriGoldMain)" stroke-width="1.4" opacity="0.7" />
    <circle cx="500" cy="500" r="5.5" fill="url(#binduRadiance)" stroke="#FFFFFF" stroke-width="1.2" />
  </g>
</svg>

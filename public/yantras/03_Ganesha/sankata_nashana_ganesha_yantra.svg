  <!-- 8 Petal Mantras -->
  <g id="ashta_seeds" font-family="'Noto Sans Devanagari', serif" font-weight="900" font-size="16" fill="#1A0E05" text-anchor="middle" dominant-baseline="central">
    <text x="500.0" y="288.0">ॐ</text>
    <text x="649.9" y="350.1">गं</text>
    <text x="712.0" y="500.0">विघ्न</text>
    <text x="649.9" y="649.9">हर्त्रे</text>
    <text x="500.0" y="712.0">नमः</text>
    <text x="350.1" y="649.9">सिद्धि</text>
    <text x="288.0" y="500.0">बुद्धि</text>
    <text x="350.1" y="350.1">प्रदाय</text>
  </g>


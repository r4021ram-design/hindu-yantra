  <!-- 12 Sacred Names of Sankata Nashana Ganesha -->
  <g id="sankata_names_12" font-family="'Noto Sans Devanagari', serif" font-weight="800" font-size="13.5" fill="#1A0E05" text-anchor="middle" dominant-baseline="central">

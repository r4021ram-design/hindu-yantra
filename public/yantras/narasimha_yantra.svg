    <path d="M 500.00 300.00 L 500.00 180.00" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.75" />
    <path d="M 641.42 358.58 L 726.27 273.73" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.75" />
    <path d="M 700.00 500.00 L 820.00 500.00" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.75" />
    <path d="M 641.42 641.42 L 726.27 726.27" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.75" />
    <path d="M 500.00 700.00 L 500.00 820.00" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.75" />

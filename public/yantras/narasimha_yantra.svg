    <path d="M 213.1 308.3 Q 224.22400047716786 268.59646051284585 225.6 225.6 Q 268.59646051284574 224.22400047716798 308.3 213.1" />
    <path d="M 308.3 213.1 Q 333.7704992353879 180.67610005584015 351.5 141.5 Q 391.7459121784614 156.66189773063837 432.7 161.6" />
  </g>

  
  <!-- 2. Concentric Girdles (Trivalaya) -->
  <g id="trivalaya" stroke="url(#bronzeMain)" fill="none">
    <circle cx="500" cy="500" r="345" stroke-width="2.8" />
    <circle cx="500" cy="500" r="335" stroke-width="1.8" />
    <circle cx="500" cy="500" r="325" stroke-width="2.4" />
  </g>

  <!-- 3. Ashtadala Narasimha Lotus (अष्टदल नृसिंह पद्म - अनुष्टुप् महामन्त्र मण्डल) -->
  <g id="ashtadala_petals" stroke="url(#bronzeMain)" stroke-width="2.6" fill="none">
    <path d="M 423.46 315.22 C 410.22 262.40, 472.16 217.37, 500.00 180.00 C 527.84 217.37, 589.78 262.40, 576.54 315.22" />
    <path d="M 576.54 315.22 C 604.52 268.50, 680.17 280.47, 726.27 273.73 C 719.53 319.83, 731.50 395.48, 684.78 423.46" />
    <path d="M 684.78 423.46 C 737.60 410.22, 782.63 472.16, 820.00 500.00 C 782.63 527.84, 737.60 589.78, 684.78 576.54" />
    <path d="M 684.78 576.54 C 731.50 604.52, 719.53 680.17, 726.27 726.27 C 680.17 719.53, 604.52 731.50, 576.54 684.78" />

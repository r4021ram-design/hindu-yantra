    <path d="M 300.00 500.00 L 180.00 500.00" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.75" />
    <path d="M 358.58 358.58 L 273.73 273.73" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.75" />

    <path d="M 683.85 683.85 L 772.24 772.24" stroke-width="1.0" stroke-dasharray="3,3" opacity="0.6" />
    <path d="M 599.50 740.21 L 647.33 855.69" stroke-width="1.0" stroke-dasharray="3,3" opacity="0.6" />
    <path d="M 500.00 760.00 L 500.00 885.00" stroke-width="1.0" stroke-dasharray="3,3" opacity="0.6" />

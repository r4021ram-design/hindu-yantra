  <g id="avarana_2_shodashadala" stroke="url(#sriGoldMain)" stroke-width="2.2" fill="rgba(212,175,55,0.08)" stroke-linejoin="round">
    <path id="lotus_16_petals" d="M 444.2 219.5 Q 463.09 165.63, 500 144 Q 536.91 165.63, 555.8 219.5 M 555.8 219.5 Q 593.85 176.96, 636.24 171.1 Q 662.06 205.21, 658.89 262.2 M 658.89 262.2 Q 710.33 237.46, 751.73 248.27 Q 762.54 289.67, 737.8 341.11 M 737.8 341.11 Q 794.79 337.94, 828.9 363.76 Q 823.04 406.15, 780.5 444.2 M 780.5 444.2 Q 834.37 463.09, 856 500 Q 834.37 536.91, 780.5 555.8 M 780.5 555.8 Q 823.04 593.85, 828.9 636.24 Q 794.79 662.06, 737.8 658.89 M 737.8 658.89 Q 762.54 710.33, 751.73 751.73 Q 710.33 762.54, 658.89 737.8 M 658.89 737.8 Q 662.06 794.79, 636.24 828.9 Q 593.85 823.04, 555.8 780.5 M 555.8 780.5 Q 536.91 834.37, 500 856 Q 463.09 834.37, 444.2 780.5 M 444.2 780.5 Q 406.15 823.04, 363.76 828.9 Q 337.94 794.79, 341.11 737.8 M 341.11 737.8 Q 289.67 762.54, 248.27 751.73 Q 237.46 710.33, 262.2 658.89 M 262.2 658.89 Q 205.21 662.06, 171.1 636.24 Q 176.96 593.85, 219.5 555.8 M 219.5 555.8 Q 165.63 536.91, 144 500 Q 165.63 463.09, 219.5 444.2 M 219.5 444.2 Q 176.96 406.15, 171.1 363.76 Q 205.21 337.94, 262.2 341.11 M 262.2 341.11 Q 237.46 289.67, 248.27 248.27 Q 289.67 237.46, 341.11 262.2 M 341.11 262.2 Q 337.94 205.21, 363.76 171.1 Q 406.15 176.96, 444.2 219.5 " />
  </g>

  <!-- 4. MIDDLE CONCENTRIC CIRCLE RINGS -->
  <g id="transition_middle_circles" stroke="url(#sriGoldAccent)" stroke-width="1.8" fill="none">
    <circle cx="500" cy="500" r="286" />
    <circle cx="500" cy="500" r="278" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6" />
  </g>

  <!-- 5. ASHTA DALA (8 LOTUS PETALS) -->
  <g id="avarana_3_ashtadala" stroke="url(#sriGoldMain)" stroke-width="2.2" fill="rgba(217,119,6,0.12)" stroke-linejoin="round">
    <path id="lotus_8_petals" d="M 415.81 296.75 Q 441.64 238.92, 500 214 Q 558.36 238.92, 584.19 296.75 M 584.19 296.75 Q 643.34 274.13, 702.23 297.77 Q 725.87 356.66, 703.25 415.81 M 703.25 415.81 Q 761.08 441.64, 786 500 Q 761.08 558.36, 703.25 584.19 M 703.25 584.19 Q 725.87 643.34, 702.23 702.23 Q 643.34 725.87, 584.19 703.25 M 584.19 703.25 Q 558.36 761.08, 500 786 Q 441.64 761.08, 415.81 703.25 M 415.81 703.25 Q 356.66 725.87, 297.77 702.23 Q 274.13 643.34, 296.75 584.19 M 296.75 584.19 Q 238.92 558.36, 214 500 Q 238.92 441.64, 296.75 415.81 M 296.75 415.81 Q 274.13 356.66, 297.77 297.77 Q 356.66 274.13, 415.81 296.75 " />
  </g>

  <!-- 6. INNER CONCENTRIC CIRCLE RINGS -->
  <g id="transition_inner_circles" stroke="url(#sriGoldAccent)" stroke-width="2" fill="none">
    <circle cx="500" cy="500" r="220" />
    <circle cx="500" cy="500" r="214" stroke-width="1.2" stroke-dasharray="4 2" opacity="0.7" />
  </g>

  <!-- 7. THE SACRED 9 INTERLOCKING SHIVA-SHAKTI PRIMARY TRIANGLES (NAVAYONI) -->
  <g id="navayoni_interlocking_triangles" stroke="url(#sriGoldMain)" stroke-width="2.2" stroke-linejoin="miter">
    <!-- 4 Upward Shiva Triangles (Purusha) -->
    <path id="primary_tri_U1" d="M 208.95 572.74 L 791.05 572.74 L 500 200 Z" fill="rgba(212,175,55,0.07)" />
    <path id="primary_tri_U2" d="M 284.79 643.77 L 715.21 643.77 L 500 284.32 Z" fill="rgba(212,175,55,0.07)" />
    <path id="primary_tri_U3" d="M 346.15 710.11 L 653.85 710.11 L 500 419.62 Z" fill="rgba(212,175,55,0.07)" />
    <path id="primary_tri_U4" d="M 394.85 531.98 L 605.15 531.98 L 500 359.37 Z" fill="rgba(212,175,55,0.07)" />

    <!-- 5 Downward Shakti Triangles (Prakriti) -->
    <path id="primary_tri_D1" d="M 210.97 419.62 L 789.03 419.62 L 500 800 Z" fill="rgba(245,158,11,0.09)" />
    <path id="primary_tri_D2" d="M 292.95 359.37 L 707.05 359.37 L 500 710.11 Z" fill="rgba(245,158,11,0.09)" />
    <path id="primary_tri_D3" d="M 321.46 284.32 L 678.54 284.32 L 500 531.98 Z" fill="rgba(245,158,11,0.09)" />
    <path id="primary_tri_D4" d="M 399.05 452.92 L 600.95 452.92 L 500 643.77 Z" fill="rgba(245,158,11,0.09)" />
    
    <!-- Central Innermost Downward Triangle (Kamakala Mula Trikona) -->
    <path id="primary_tri_D5_central" d="M 423.84 484.39 L 576.16 484.39 L 500 572.74 Z" fill="rgba(255,215,0,0.32)" stroke="#FFE066" stroke-width="2.6" />
  </g>

  <!-- 8. CENTRAL BINDU (MAHABINDU SINGULARITY) -->
  <g id="avarana_9_bindu">
    <circle cx="500" cy="500" r="22" fill="rgba(255,215,0,0.15)" stroke="#FFE066" stroke-width="1.2" stroke-dasharray="3 2" />
    <circle cx="500" cy="500" r="13" fill="none" stroke="#FFD700" stroke-width="1.8" />
    <circle cx="500" cy="500" r="7" fill="url(#binduRadiance)" stroke="#FFFFFF" stroke-width="1.6" />
  </g>
</svg>

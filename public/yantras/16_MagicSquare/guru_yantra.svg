      <text x="596.6666666666667" y="400.3333333333333" text-anchor="middle" font-family="'Cinzel Decorative', 'Noto Sans Devanagari', serif" font-size="28" font-weight="900" fill="#1A0E05">१२</text>
      <text x="596.6666666666667" y="425.3333333333333" text-anchor="middle" font-family="'Cinzel', sans-serif" font-size="13" font-weight="700" fill="#6B3A0A" opacity="0.85">12</text>
      <!-- Cell [1,0] -->
      <text x="403.3333333333333" y="497" text-anchor="middle" font-family="'Cinzel Decorative', 'Noto Sans Devanagari', serif" font-size="28" font-weight="900" fill="#1A0E05">११</text>
      <text x="403.3333333333333" y="522" text-anchor="middle" font-family="'Cinzel', sans-serif" font-size="13" font-weight="700" fill="#6B3A0A" opacity="0.85">11</text>
      <!-- Cell [1,1] -->
      <text x="500" y="497" text-anchor="middle" font-family="'Cinzel Decorative', 'Noto Sans Devanagari', serif" font-size="28" font-weight="900" fill="#1A0E05">९</text>
      <text x="500" y="522" text-anchor="middle" font-family="'Cinzel', sans-serif" font-size="13" font-weight="700" fill="#6B3A0A" opacity="0.85">9</text>
      <!-- Cell [1,2] -->
      <text x="596.6666666666667" y="497" text-anchor="middle" font-family="'Cinzel Decorative', 'Noto Sans Devanagari', serif" font-size="28" font-weight="900" fill="#1A0E05">७</text>
      <text x="596.6666666666667" y="522" text-anchor="middle" font-family="'Cinzel', sans-serif" font-size="13" font-weight="700" fill="#6B3A0A" opacity="0.85">7</text>
      <!-- Cell [2,0] -->
      <text x="403.3333333333333" y="593.6666666666667" text-anchor="middle" font-family="'Cinzel Decorative', 'Noto Sans Devanagari', serif" font-size="28" font-weight="900" fill="#1A0E05">६</text>
      <text x="403.3333333333333" y="618.6666666666667" text-anchor="middle" font-family="'Cinzel', sans-serif" font-size="13" font-weight="700" fill="#6B3A0A" opacity="0.85">6</text>
      <!-- Cell [2,1] -->
      <text x="500" y="593.6666666666667" text-anchor="middle" font-family="'Cinzel Decorative', 'Noto Sans Devanagari', serif" font-size="28" font-weight="900" fill="#1A0E05">१३</text>
      <text x="500" y="618.6666666666667" text-anchor="middle" font-family="'Cinzel', sans-serif" font-size="13" font-weight="700" fill="#6B3A0A" opacity="0.85">13</text>
      <!-- Cell [2,2] -->
      <text x="596.6666666666667" y="593.6666666666667" text-anchor="middle" font-family="'Cinzel Decorative', 'Noto Sans Devanagari', serif" font-size="28" font-weight="900" fill="#1A0E05">८</text>
      <text x="596.6666666666667" y="618.6666666666667" text-anchor="middle" font-family="'Cinzel', sans-serif" font-size="13" font-weight="700" fill="#6B3A0A" opacity="0.85">8</text>
  </g>

  <!-- Sacred Magic Sum Badge Below Matrix -->
  <g id="magic-sum-badge">
    <rect x="420" y="660" width="160" height="26" rx="13" fill="#F4EAD8" stroke="url(#bronzeMain)" stroke-width="1.8" />
    <text x="500" y="677" text-anchor="middle" font-family="'Cinzel', monospace" font-size="12" font-weight="bold" fill="#4D0E00">योग (SUM): 27</text>
  </g>

  <!-- Presiding Beeja at Apex -->
  <text x="500" y="338" text-anchor="middle" font-family="'Cinzel Decorative', 'Noto Sans Devanagari', serif" font-size="22" font-weight="900" fill="#8C2300">ॐ ग्रां ग्रीं ग्रौं सः गुरवे नमः</text>

</svg>
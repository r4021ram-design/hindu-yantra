    <path d="M 562.43 813.85 C 562.75 843.57, 517.93 865.06, 500.00 885.00 C 482.07 865.06, 437.25 843.57, 437.57 813.85" />
    <path d="M 437.57 813.85 C 426.49 841.43, 376.87 844.13, 352.67 855.69 C 343.73 830.41, 310.55 793.40, 322.22 766.07" />
    <path d="M 322.22 766.07 C 301.43 787.31, 254.55 770.82, 227.76 772.24 C 229.18 745.45, 212.69 698.57, 233.93 677.78" />
    <path d="M 233.93 677.78 C 206.60 689.45, 169.59 656.27, 144.31 647.33 C 155.87 623.13, 158.57 573.51, 186.15 562.43" />
    <path d="M 186.15 562.43 C 156.43 562.75, 134.94 517.93, 115.00 500.00 C 134.94 482.07, 156.43 437.25, 186.15 437.57" />
    <path d="M 186.15 437.57 C 158.57 426.49, 155.87 376.87, 144.31 352.67 C 169.59 343.73, 206.60 310.55, 233.93 322.22" />
    <path d="M 233.93 322.22 C 212.69 301.43, 229.18 254.55, 227.76 227.76 C 254.55 229.18, 301.43 212.69, 322.22 233.93" />
    <path d="M 322.22 233.93 C 310.55 206.60, 343.73 169.59, 352.67 144.31 C 376.87 155.87, 426.49 158.57, 437.57 186.15" />

  </g>

  <!-- 4. Intermediate Girdle -->
  <circle cx="500" cy="500" r="320" stroke="url(#bronzeMain)" stroke-width="2.4" fill="none" />
  <circle cx="500" cy="500" r="310" stroke="url(#bronzeMain)" stroke-width="1.8" fill="none" />

  <!-- 5. Ashtadala Padma (8-Petal Ogee Lotus of the Ashta Bhairavas) -->
  <g id="ashtadala_petals" stroke="url(#bronzeMain)" stroke-width="2.6" fill="rgba(153,27,27,0.03)" stroke-linejoin="round">
    <path d="M 415.81 296.75 C 407.92 256.32, 472.26 218.36, 500.00 190.00 C 527.74 218.36, 592.08 256.32, 584.19 296.75" />

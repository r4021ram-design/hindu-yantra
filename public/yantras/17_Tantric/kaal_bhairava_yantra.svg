    <path d="M 296.75 415.81 C 262.58 392.80, 281.24 320.47, 280.80 280.80 C 320.47 281.24, 392.80 262.58, 415.81 296.75" />

  </g>
  <g id="ashtadala_spines" stroke="url(#bronzeLight)" fill="none">
    <path d="M 500.00 280.00 L 500.00 190.00" stroke-width="1.8" stroke-dasharray="3,3" />
    <path d="M 655.56 344.44 L 719.20 280.80" stroke-width="1.8" stroke-dasharray="3,3" />
    <path d="M 720.00 500.00 L 810.00 500.00" stroke-width="1.8" stroke-dasharray="3,3" />
    <path d="M 655.56 655.56 L 719.20 719.20" stroke-width="1.8" stroke-dasharray="3,3" />
    <path d="M 500.00 720.00 L 500.00 810.00" stroke-width="1.8" stroke-dasharray="3,3" />
    <path d="M 344.44 655.56 L 280.80 719.20" stroke-width="1.8" stroke-dasharray="3,3" />
    <path d="M 280.00 500.00 L 190.00 500.00" stroke-width="1.8" stroke-dasharray="3,3" />
    <path d="M 344.44 344.44 L 280.80 280.80" stroke-width="1.8" stroke-dasharray="3,3" />

  </g>
  <g id="ashtadala_names">
    <text x="500.0" y="239.0" font-family="'Noto Sans Devanagari', 'Sanskrit Text', serif" font-size="13" font-weight="bold" fill="#1A0E05" text-anchor="middle">असिताङ्ग</text>
    <text x="687.4" y="316.6" font-family="'Noto Sans Devanagari', 'Sanskrit Text', serif" font-size="13" font-weight="bold" fill="#1A0E05" text-anchor="middle">रुरु</text>
    <text x="765.0" y="504.0" font-family="'Noto Sans Devanagari', 'Sanskrit Text', serif" font-size="13" font-weight="bold" fill="#1A0E05" text-anchor="middle">चण्ड</text>
    <text x="687.4" y="691.4" font-family="'Noto Sans Devanagari', 'Sanskrit Text', serif" font-size="13" font-weight="bold" fill="#1A0E05" text-anchor="middle">क्रोध</text>
    <text x="500.0" y="769.0" font-family="'Noto Sans Devanagari', 'Sanskrit Text', serif" font-size="13" font-weight="bold" fill="#1A0E05" text-anchor="middle">उन्मत्त</text>
    <text x="312.6" y="691.4" font-family="'Noto Sans Devanagari', 'Sanskrit Text', serif" font-size="13" font-weight="bold" fill="#1A0E05" text-anchor="middle">कपाली</text>
    <text x="235.0" y="504.0" font-family="'Noto Sans Devanagari', 'Sanskrit Text', serif" font-size="13" font-weight="bold" fill="#1A0E05" text-anchor="middle">भीषण</text>
    <text x="312.6" y="316.6" font-family="'Noto Sans Devanagari', 'Sanskrit Text', serif" font-size="13" font-weight="bold" fill="#1A0E05" text-anchor="middle">संहार</text>

  </g>

  <!-- 6. Inner Girdle -->
  <circle cx="500" cy="500" r="220" stroke="url(#bronzeMain)" stroke-width="2.6" fill="none" />
  <circle cx="500" cy="500" r="205" stroke="url(#bronzeMain)" stroke-width="1.8" fill="none" />

  <!-- 7. Dynamic Ashta-Kona / Kaalachakra Octagram Star of Dissolution -->
  <g id="kaalachakra_star" stroke="url(#bronzeMain)" stroke-width="2.8" fill="rgba(180,83,9,0.05)" stroke-linejoin="round">
    <path d="M 500.0,310.0 L 538.3,407.6 L 634.4,365.6 L 592.4,461.7 L 690.0,500.0 L 592.4,538.3 L 634.4,634.4 L 538.3,592.4 L 500.0,690.0 L 461.7,592.4 L 365.6,634.4 L 407.6,538.3 L 310.0,500.0 L 407.6,461.7 L 365.6,365.6 L 461.7,407.6 Z" />
  </g>

  <!-- Star Rays Protective Seeds -->
  <g font-family="'Noto Sans Devanagari', 'Sanskrit Text', serif" font-size="14" font-weight="bold" fill="#1A0E05" text-anchor="middle">
    <text x="500" y="335">भ्रं</text>
    <text x="615" y="380">काल</text>
    <text x="665" y="505">भैरवाय</text>
    <text x="615" y="630">नमः</text>
    <text x="500" y="675">हुं</text>
    <text x="385" y="630">फट्</text>
    <text x="335" y="505">स्वाहा</text>
    <text x="385" y="380">ॐ</text>
  </g>

  <!-- 8. Central Dissolution Inverted Triangle -->
  <g id="central_trikona" stroke="url(#bronzeMain)" stroke-width="2.6" fill="rgba(153,27,27,0.08)" stroke-linejoin="round">
    <path d="M 500 580 L 569.282032302755 460 L 430.71796769724494 460 Z" />
  </g>

  <!-- 9. Central Fierce Singularity & Mahabeeja -->
  <circle cx="500" cy="500" r="48" fill="url(#fieryBhairavaGlow)" />
  <circle cx="500" cy="500" r="16" fill="url(#binduGoldGlow)" stroke="url(#bronzeMain)" stroke-width="2" />
  <circle cx="500" cy="500" r="4.5" fill="#1A0E05" />

  <!-- Center Mahabeeja 'भ्रं' -->
  <text x="500" y="506" font-family="'Noto Sans Devanagari', 'Sanskrit Text', serif" font-size="18" font-weight="bold" fill="#1A0E05" text-anchor="middle">भ्रं</text>

  <text x="500" y="875" font-family="'Noto Sans Devanagari', 'Sanskrit Text', serif" font-size="18" font-weight="bold" fill="#1A0E05" text-anchor="middle" letter-spacing="1">॥ श्री काल भैरव यन्त्रम् ॥</text>
  <text x="500" y="902" font-family="'Cinzel', serif" font-size="12" font-weight="bold" fill="#3E1E07" text-anchor="middle" letter-spacing="2">OM BHRAM KAALABHAIRAVAYA NAMAHA</text>
</svg>
    <path d="M 274.83 370.00 L 166.58 307.50" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.6" />
    <path d="M 370.00 274.83 L 307.50 166.58" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.6" />
  </g>

  <!-- 12 Dala Beejaksharas -->
  <g id="dvadasha_seeds" font-family="'Noto Sans Devanagari', serif" font-weight="700" font-size="18" fill="#1A0E05" text-anchor="middle" dominant-baseline="central">
    <text x="500.0" y="172.0">ह्रौं</text>
    <text x="664.0" y="215.9">ऐं</text>
    <text x="784.1" y="336.0">क्लीं</text>
    <text x="828.0" y="500.0">सौः</text>
    <text x="784.1" y="664.0">ह्रीं</text>
    <text x="664.0" y="784.1">श्रीं</text>
    <text x="500.0" y="828.0">ह्रौं</text>
    <text x="336.0" y="784.1">ऐं</text>
    <text x="215.9" y="664.0">क्लीं</text>
    <text x="172.0" y="500.0">सौः</text>
    <text x="215.9" y="336.0">ह्रीं</text>
    <text x="336.0" y="215.9">श्रीं</text>
  </g>

  <!-- Intermediate Girdles -->
  <circle cx="500" cy="500" r="260" stroke="url(#bronzeMain)" stroke-width="2.4" fill="none" />
  <circle cx="500" cy="500" r="250" stroke="url(#bronzeMain)" stroke-width="1.6" fill="none" />

  <!-- 4. Inner Ashta-Dala Lotus (अष्टदल पद्म - अष्टसिद्धि मण्डल) -->
  <g id="ashtadala_lotus" stroke="url(#bronzeMain)" stroke-width="2.4" fill="none">

  <g id="trivalaya" stroke="url(#bronzeMain)" fill="none">
    <circle cx="500" cy="500" r="415" stroke-width="2.8" />
    <circle cx="500" cy="500" r="400" stroke-width="1.8" />
    <circle cx="500" cy="500" r="385" stroke-width="2.4" />
  </g>


  <!-- 16 Petal Beejaksharas -->
  <g id="petal_16_seeds" font-family="'Noto Sans Devanagari', serif" font-weight="700" font-size="14" fill="#1A0E05" text-anchor="middle" dominant-baseline="central">
    <text x="500.0" y="165.0">ॐ</text>
    <text x="628.2" y="190.5">श्रीं</text>
    <text x="736.9" y="263.1">ह्रीं</text>
    <text x="809.5" y="371.8">क्लीं</text>
    <text x="835.0" y="500.0">ग्लौं</text>
    <text x="809.5" y="628.2">गं</text>
    <text x="736.9" y="736.9">गण</text>
    <text x="628.2" y="809.5">पतये</text>

  <!-- Petal Protection Mantras -->
  <g id="petal-mantras">
    <text x="500.00" y="201.00" font-family="'Noto Sans Devanagari', 'Cinzel', serif" font-size="20" font-weight="900" fill="#2E1606" text-anchor="middle">ॐ</text>
    <text x="685.15" y="259.25" font-family="'Noto Sans Devanagari', 'Cinzel', serif" font-size="20" font-weight="900" fill="#2E1606" text-anchor="middle">ह्रां</text>
    <text x="799.58" y="411.75" font-family="'Noto Sans Devanagari', 'Cinzel', serif" font-size="20" font-weight="900" fill="#2E1606" text-anchor="middle">ह्रीं</text>
    <text x="799.58" y="600.25" font-family="'Noto Sans Devanagari', 'Cinzel', serif" font-size="20" font-weight="900" fill="#2E1606" text-anchor="middle">ह्रूं</text>
    <text x="685.15" y="752.75" font-family="'Noto Sans Devanagari', 'Cinzel', serif" font-size="20" font-weight="900" fill="#2E1606" text-anchor="middle">ह्रैं</text>
    <text x="500.00" y="811.00" font-family="'Noto Sans Devanagari', 'Cinzel', serif" font-size="20" font-weight="900" fill="#2E1606" text-anchor="middle">ह्रौं</text>
    <text x="314.85" y="752.75" font-family="'Noto Sans Devanagari', 'Cinzel', serif" font-size="20" font-weight="900" fill="#2E1606" text-anchor="middle">ह्रः</text>
    <text x="200.42" y="600.25" font-family="'Noto Sans Devanagari', 'Cinzel', serif" font-size="20" font-weight="900" fill="#2E1606" text-anchor="middle">हुं</text>
    <text x="200.42" y="411.75" font-family="'Noto Sans Devanagari', 'Cinzel', serif" font-size="20" font-weight="900" fill="#2E1606" text-anchor="middle">फट्</text>
    <text x="314.85" y="259.25" font-family="'Noto Sans Devanagari', 'Cinzel', serif" font-size="20" font-weight="900" fill="#2E1606" text-anchor="middle">स्वाहा</text>
  </g>

  <!-- Inner Rings -->
  <g id="inner-rings" stroke="url(#bronzeMain)" fill="none">
    <circle cx="500" cy="500" r="260" stroke-width="2.8" />
    <circle cx="500" cy="500" r="248" stroke-width="1.8" />
  </g>

  <!-- Sacred Panchamukhi Star Matrix -->
  <g id="panchamukhi-star-matrix" stroke="url(#bronzeMain)" stroke-width="2.6" fill="none" stroke-linejoin="round">
    <polygon points="500.00,270.00 718.74,428.93 635.19,686.07 364.81,686.07 281.26,428.93" stroke-width="2.0" fill="#542608" fill-opacity="0.04" />
    <path d="M 500.00 270.00 L 635.19 686.07 L 281.26 428.93 L 718.74 428.93 L 364.81 686.07 Z" stroke-width="2.8" />
  </g>

  <!-- 5 Holy Face Inscriptions -->

    <g id="face-वानर" font-family="'Noto Sans Devanagari', serif" text-anchor="middle" font-weight="900">
      <text x="500" y="310" font-size="16" fill="#7A1D00">वानर</text>
      <text x="500" y="330" font-size="20" fill="#2E1606">ह्रां</text>
    </g>

    <g id="face-नारसिंह" font-family="'Noto Sans Devanagari', serif" text-anchor="middle" font-weight="900">
      <text x="670" y="440" font-size="16" fill="#7A1D00">नारसिंह</text>
      <text x="670" y="460" font-size="20" fill="#2E1606">ह्रीं</text>
    </g>

    <g id="face-गरुड़" font-family="'Noto Sans Devanagari', serif" text-anchor="middle" font-weight="900">
      <text x="605" y="640" font-size="16" fill="#7A1D00">गरुड़</text>
      <text x="605" y="660" font-size="20" fill="#2E1606">ह्रूं</text>
    </g>

    <g id="face-वराह" font-family="'Noto Sans Devanagari', serif" text-anchor="middle" font-weight="900">
      <text x="395" y="640" font-size="16" fill="#7A1D00">वराह</text>
      <text x="395" y="660" font-size="20" fill="#2E1606">ह्रैं</text>
    </g>

    <g id="face-हयग्रीव" font-family="'Noto Sans Devanagari', serif" text-anchor="middle" font-weight="900">
      <text x="330" y="440" font-size="16" fill="#7A1D00">हयग्रीव</text>
      <text x="330" y="460" font-size="20" fill="#2E1606">ह्रौं</text>
    </g>

  <!-- Central Pavana-Tanaya Maruti Core -->
  <g id="maruti-core-sanctum">
    <circle cx="500" cy="500" r="50" fill="url(#goldSolarGlow)" />
    <circle cx="500" cy="500" r="42" fill="#FAF6EE" stroke="url(#bronzeMain)" stroke-width="2.6" />
    <text x="500" y="490" font-family="'Noto Sans Devanagari', serif" font-size="15" font-weight="900" fill="#7A1500" text-anchor="middle">ॐ हं</text>
    <text x="500" y="515" font-family="'Noto Sans Devanagari', serif" font-size="24" font-weight="900" fill="#7A1500" text-anchor="middle">हनुमते</text>
    <text x="500" y="534" font-family="'Noto Sans Devanagari', serif" font-size="14" font-weight="900" fill="#7A1500" text-anchor="middle">रुद्रात्मकाय</text>
    <circle cx="500" cy="500" r="4" fill="#7A1500" />
  </g>
</svg>
    <path d="M 652.82 710.34 L 723.36 807.43" stroke-width="1.6" opacity="0.75" />
    <path d="M 580.34 747.27 C 589.50 800.98, 526.99 842.94, 500.00 880.00 C 473.01 842.94, 410.50 800.98, 419.66 747.27" stroke-width="2.6" />
    <path d="M 500.00 760.00 L 500.00 880.00" stroke-width="1.6" opacity="0.75" />
    <path d="M 419.66 747.27 C 395.49 796.10, 320.26 793.31, 276.64 807.43 C 276.59 761.58, 250.69 690.89, 289.66 652.82" stroke-width="2.6" />
    <path d="M 347.18 710.34 L 276.64 807.43" stroke-width="1.6" opacity="0.75" />

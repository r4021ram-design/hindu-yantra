<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="60%" stop-color="#F7EEDF" />
      <stop offset="100%" stop-color="#EADBBE" />
    </radialGradient>

    <!-- Thick Madhyama Wood Gradient -->
    <linearGradient id="madhyamaWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A04000" />
      <stop offset="40%" stop-color="#78281F" />
      <stop offset="80%" stop-color="#4D130D" />
      <stop offset="100%" stop-color="#240705" />
    </linearGradient>

    <!-- Dakshina Wood Gradient -->
    <linearGradient id="dakshinaWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B9770E" />
      <stop offset="40%" stop-color="#935116" />
      <stop offset="80%" stop-color="#5B2C05" />
      <stop offset="100%" stop-color="#2D1402" />
    </linearGradient>

    <!-- Uttara Wood Gradient -->
    <linearGradient id="uttaraWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4AC0D" />
      <stop offset="40%" stop-color="#9A7D0A" />
      <stop offset="80%" stop-color="#584504" />
      <stop offset="100%" stop-color="#281F02" />
    </linearGradient>

    <!-- Gold Accent Bindings -->
    <linearGradient id="goldKnot" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FFF2A3" />
      <stop offset="100%" stop-color="#936814" />
    </linearGradient>

    <filter id="patraShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#3B100B" flood-opacity="0.38" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#bgGrad)" />

  <!-- Outer Sacred Geometry Frame -->
  <rect x="35" y="35" width="930" height="930" rx="28" fill="none" stroke="#C5A059" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />
  <rect x="50" y="50" width="900" height="900" rx="22" fill="none" stroke="#805713" stroke-width="3" opacity="0.8" />
  <circle cx="500" cy="500" r="410" fill="none" stroke="#C5A059" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.45" />

  <!-- Dimensions Indicator -->
  <g opacity="0.7">
    <line x1="160" y1="230" x2="840" y2="230" stroke="#805713" stroke-width="1.5" />
    <path d="M 160 230 L 175 224 L 175 236 Z" fill="#805713" />
    <path d="M 840 230 L 825 224 L 825 236 Z" fill="#805713" />
    <text x="500" y="215" font-family="'Cinzel', 'Noto Serif', serif" font-size="16" font-weight="bold" fill="#805713" text-anchor="middle" letter-spacing="1">
      मानक प्रमाण: १ बाहु (२४ अंगुल • १८ इंच • ४५.७ सेमी) प्रति परिधि
    </text>
  </g>

  <!-- THREE PARIDHIS (परिधि त्रय) -->
  <g filter="url(#patraShadow)">
    
    <!-- 1. MADHYAMA PARIDHI (मध्यम परिधि - पश्चिमाभिमुख • सर्वाधिक स्थूल/मोटी) -->
    <g transform="translate(0, 310)">
      <rect x="180" y="0" width="640" height="52" rx="14" fill="url(#madhyamaWood)" stroke="#240705" stroke-width="3" />
      <ellipse cx="180" cy="26" rx="14" ry="26" fill="#D98880" stroke="#4D130D" stroke-width="2" />
      <ellipse cx="820" cy="26" rx="14" ry="26" fill="#D98880" stroke="#4D130D" stroke-width="2" />
      <!-- Bark Texture lines -->
      <line x1="220" y1="16" x2="780" y2="16" stroke="#EDBB99" stroke-width="1.5" opacity="0.6" />
      <line x1="230" y1="36" x2="770" y2="36" stroke="#1F0604" stroke-width="2.5" opacity="0.75" />
      <!-- Gold Ritual Knot Label -->
      <rect x="250" y="8" width="16" height="36" rx="4" fill="url(#goldKnot)" />
      <rect x="730" y="8" width="16" height="36" rx="4" fill="url(#goldKnot)" />
      <!-- Label -->
      <text x="500" y="32" font-family="'Noto Serif', serif" font-size="16" font-weight="bold" fill="#FFF" text-anchor="middle">
        १. मध्यम परिधि (पश्चिम भाग • स्थूलतम काष्ठ)
      </text>
    </g>

    <!-- 2. DAKSHINA PARIDHI (दक्षिण परिधि - दक्षिणाभिमुख • मध्यम मोटाई) -->
    <g transform="translate(0, 430)">
      <rect x="180" y="0" width="640" height="40" rx="12" fill="url(#dakshinaWood)" stroke="#2D1402" stroke-width="3" />
      <ellipse cx="180" cy="20" rx="12" ry="20" fill="#F5CBA7" stroke="#5B2C05" stroke-width="2" />
      <ellipse cx="820" cy="20" rx="12" ry="20" fill="#F5CBA7" stroke="#5B2C05" stroke-width="2" />
      <line x1="220" y1="12" x2="780" y2="12" stroke="#F8C471" stroke-width="1.5" opacity="0.6" />
      <line x1="230" y1="28" x2="770" y2="28" stroke="#1F0604" stroke-width="2" opacity="0.75" />
      <rect x="260" y="6" width="14" height="28" rx="4" fill="url(#goldKnot)" />
      <rect x="720" y="6" width="14" height="28" rx="4" fill="url(#goldKnot)" />
      <text x="500" y="26" font-family="'Noto Serif', serif" font-size="15" font-weight="bold" fill="#FFF" text-anchor="middle">
        २. दक्षिण परिधि (दक्षिण भाग • मध्यम काष्ठ)
      </text>
    </g>

    <!-- 3. UTTARA PARIDHI (उत्तर परिधि - उत्तराभिमुख • सूक्ष्म/पतली) -->
    <g transform="translate(0, 535)">
      <rect x="180" y="0" width="640" height="30" rx="10" fill="url(#uttaraWood)" stroke="#281F02" stroke-width="2.5" />
      <ellipse cx="180" cy="15" rx="10" ry="15" fill="#F9E79F" stroke="#584504" stroke-width="1.8" />
      <ellipse cx="820" cy="15" rx="10" ry="15" fill="#F9E79F" stroke="#584504" stroke-width="1.8" />
      <line x1="220" y1="9" x2="780" y2="9" stroke="#FCF3CF" stroke-width="1.2" opacity="0.6" />
      <line x1="230" y1="21" x2="770" y2="21" stroke="#1F0604" stroke-width="1.8" opacity="0.75" />
      <rect x="270" y="4" width="12" height="22" rx="3" fill="url(#goldKnot)" />
      <rect x="710" y="4" width="12" height="22" rx="3" fill="url(#goldKnot)" />
      <text x="500" y="20" font-family="'Noto Serif', serif" font-size="14" font-weight="bold" fill="#FFF" text-anchor="middle">
        ३. उत्तर परिधि (उत्तर भाग • सूक्ष्म काष्ठ)
      </text>
    </g>

    <!-- Placement Schematic Diagram (सूक्ष्म कुण्ड सीमा विन्यास) -->
    <g transform="translate(500, 640)" opacity="0.9">
      <!-- Mini Kunda Square -->
      <rect x="-40" y="-30" width="80" height="60" fill="#F5EFE4" stroke="#805713" stroke-width="2" stroke-dasharray="4 4" />
      <!-- West Paridhi -->
      <line x1="-50" y1="-30" x2="-50" y2="30" stroke="#78281F" stroke-width="7" stroke-linecap="round" />
      <!-- South Paridhi -->
      <line x1="-40" y1="38" x2="40" y2="38" stroke="#935116" stroke-width="5.5" stroke-linecap="round" />
      <!-- North Paridhi -->
      <line x1="-40" y1="-38" x2="40" y2="-38" stroke="#9A7D0A" stroke-width="4" stroke-linecap="round" />
      <!-- Labels -->
      <text x="-65" y="5" font-family="'Noto Serif', serif" font-size="11" font-weight="bold" fill="#78281F" text-anchor="end">पश्चिम</text>
      <text x="0" y="54" font-family="'Noto Serif', serif" font-size="11" font-weight="bold" fill="#935116" text-anchor="middle">दक्षिण</text>
      <text x="0" y="-46" font-family="'Noto Serif', serif" font-size="11" font-weight="bold" fill="#9A7D0A" text-anchor="middle">उत्तर</text>
      <text x="0" y="5" font-family="'Noto Serif', serif" font-size="11" font-weight="bold" fill="#D9531E" text-anchor="middle">कुण्ड</text>
    </g>

  </g>

  <!-- Sacred Details & Typography -->
  <g transform="translate(500, 770)" text-anchor="middle">
    <text y="0" font-family="'Cinzel', 'Noto Serif', serif" font-size="34" font-weight="900" fill="#6A1B07" letter-spacing="2">
      परिधि त्रय (PARIDHI TRAYA)
    </text>
    <text y="30" font-family="'Noto Serif', serif" font-size="18" font-weight="bold" fill="#805713">
      पलाश/शमी काष्ठ निर्मित • कुण्ड के पश्चिम, दक्षिण एवं उत्तर की ३ सुरक्षा सीमाएं
    </text>

    <!-- Citation Box -->
    <rect x="-380" y="55" width="760" height="95" rx="14" fill="#F5E8D3" stroke="#C5A059" stroke-width="1.5" opacity="0.9" />
    <text y="85" font-family="'Noto Serif', serif" font-size="16" font-style="italic" fill="#521706">
      "गन्धर्वोऽसि विश्वावसुः परिधिरसि ॥"
    </text>
    <text y="115" font-family="'Noto Serif', serif" font-size="13" font-weight="600" fill="#7D6B57">
      — शतपथ १.३.४ • मध्यम (स्थूल), दक्षिण (मध्यम), उत्तर (सूक्ष्म) त्रिविध सुरक्षा सीमा
    </text>
  </g>

  <!-- Top Badges -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="160" height="42" rx="10" fill="#EFE3CB" stroke="#805713" stroke-width="1.5" />
    <text x="80" y="26" font-family="monospace" font-size="13" font-weight="bold" fill="#805713" text-anchor="middle">
      त्रिविध परिधि
    </text>
  </g>
  <g transform="translate(740, 100)">
    <rect x="0" y="0" width="160" height="42" rx="10" fill="#EFE3CB" stroke="#805713" stroke-width="1.5" />
    <text x="80" y="26" font-family="monospace" font-size="13" font-weight="bold" fill="#805713" text-anchor="middle">
      कुण्ड सुरक्षा सीमा
    </text>
  </g>

</svg>

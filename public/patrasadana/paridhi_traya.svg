<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FFFDF8" />
      <stop offset="60%" stop-color="#F5EBDC" />
      <stop offset="100%" stop-color="#E2D1B3" />
    </radialGradient>

    <!-- Kusha Mat Woven Texture -->
    <linearGradient id="kushaWeave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF4DE" />
      <stop offset="30%" stop-color="#D7E8BC" />
      <stop offset="70%" stop-color="#C2DC9A" />
      <stop offset="100%" stop-color="#A6C878" />
    </linearGradient>

    <pattern id="kushaPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 0,0 L 24,24 M 24,0 L 0,24" stroke="#8CAE5B" stroke-width="0.8" opacity="0.4" />
      <line x1="0" y1="12" x2="24" y2="12" stroke="#6C8E3B" stroke-width="0.6" opacity="0.35" />
      <line x1="12" y1="0" x2="12" y2="24" stroke="#5E7E2F" stroke-width="0.6" opacity="0.35" />
    </pattern>

    <!-- Sacred Tri-Rekha Rakta-Chandana & Bhasma Aura -->
    <radialGradient id="rakshaAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEE2E2" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#F87171" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#991B1B" stop-opacity="0.08" />
    </radialGradient>

    <!-- Fresh Green Palasha Bark (सत्वक् / सच्छल्ल पलाश काष्ठ) -->
    <linearGradient id="greenPalashaBark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#84CC16" />
      <stop offset="25%" stop-color="#4D7C0F" />
      <stop offset="50%" stop-color="#3F6212" />
      <stop offset="75%" stop-color="#2D4609" />
      <stop offset="100%" stop-color="#1A2E05" />
    </linearGradient>

    <linearGradient id="woodCutEnd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="60%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#854D0E" />
    </linearGradient>

    <!-- Filters -->
    <filter id="yantraGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="patraDeepShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="8" dy="24" stdDeviation="16" flood-color="#141C04" flood-opacity="0.6" />
      <feDropShadow dx="2" dy="6" stdDeviation="6" flood-color="#263308" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="1000" fill="url(#bgGrad)" />

  <!-- Outer Temple Border -->
  <rect x="30" y="30" width="940" height="940" rx="24" fill="none" stroke="#C5A059" stroke-width="2" stroke-dasharray="8 6" opacity="0.7" />
  <rect x="42" y="42" width="916" height="916" rx="18" fill="none" stroke="#805713" stroke-width="3" opacity="0.85" />

  <!-- HEADER: Paridhi Identity -->
  <g transform="translate(500, 85)" text-anchor="middle">
    <rect x="-240" y="-30" width="480" height="42" rx="21" fill="#805713" stroke="#FDE68A" stroke-width="1.8" />
    <text y="-3" font-family="'Cinzel', 'Noto Serif', serif" font-size="18" font-weight="900" fill="#FFFDF8" letter-spacing="2">
      ॥ परिधि त्रयम् • हरित सत्वक् पलाश ॥
    </text>
    <text y="32" font-family="'Noto Serif', serif" font-size="14" font-weight="bold" fill="#6A1B07">
      मध्यमा (१ बाहु), दक्षिणा एवं उत्तरा (१-१ प्रादेश) | छाल-सहित हरी शाखाएं • कुण्ड सुरक्षा-सीमा
    </text>
  </g>

  <!-- ============================================================== -->
  <!-- 1. KUSHA MAT BED (कुश-आस्तरण वेदी) -->
  <!-- ============================================================== -->
  <g transform="translate(100, 160)">
    <rect x="0" y="0" width="800" height="640" rx="28" fill="url(#kushaWeave)" stroke="#558B2F" stroke-width="3" />
    <rect x="0" y="0" width="800" height="640" rx="28" fill="url(#kushaPattern)" />
    <rect x="12" y="12" width="776" height="616" rx="20" fill="none" stroke="#33691E" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6" />

    <!-- Akshata Grains on Mat -->
    <g fill="#FFFDF5" stroke="#D97706" stroke-width="0.6" opacity="0.85">
      <ellipse cx="80" cy="85" rx="3.5" ry="1.8" transform="rotate(25 80 85)" />
      <ellipse cx="95" cy="80" rx="3.8" ry="1.7" transform="rotate(-30 95 80)" />
      <ellipse cx="715" cy="85" rx="3.6" ry="1.8" transform="rotate(40 715 85)" />
      <ellipse cx="725" cy="545" rx="3.7" ry="1.8" transform="rotate(15 725 545)" />
      <ellipse cx="85" cy="555" rx="3.5" ry="1.7" transform="rotate(-20 85 555)" />
    </g>

    <!-- ============================================================== -->
    <!-- 2. UNDERLYING YANTRA: त्रैलोक्य रक्षा त्रिरिखा मण्डल (Tri-Rekha Raksha) -->
    <!-- ============================================================== -->
    <!-- Sharadatilakam Patala 4: "त्रैलोक्यरक्षा मण्डले त्रिरिखाङ्किते... फट्-बीजेन परिधीन् सादयेत्" -->
    <g id="underlying-yantra-paridhi" transform="translate(400, 320)" filter="url(#yantraGlowFilter)">
      <!-- Luminous Crimson Aura -->
      <circle cx="0" cy="0" r="235" fill="url(#rakshaAura)" opacity="0.45" />

      <!-- Three Concentric Protective Rectangular Boundaries (त्रिरिखा) in Rakta-Chandana & Bhasma -->
      <rect x="-210" y="-180" width="420" height="360" rx="16" fill="#FEE2E2" stroke="#991B1B" stroke-width="4.5" />
      <rect x="-185" y="-155" width="370" height="310" rx="12" fill="none" stroke="#DC2626" stroke-width="3" stroke-dasharray="8 4" />
      <rect x="-160" y="-130" width="320" height="260" rx="8" fill="#FFF1F2" stroke="#7F1D1D" stroke-width="2.5" />

      <!-- Four Corner Protective Trishulas (त्रिशूल) -->
      <g stroke="#991B1B" stroke-width="2.5" fill="#DC2626">
        <path d="M -185,-155 L -195,-170 L -185,-165 L -175,-170 Z" />
        <path d="M 185,-155 L 195,-170 L 185,-165 L 175,-170 Z" />
        <path d="M 185,155 L 195,170 L 185,165 L 175,170 Z" />
        <path d="M -185,155 L -195,170 L -185,165 L -175,170 Z" />
      </g>

      <!-- Central Astra Beeja Mantra: फट् (Protection & Shield) in Bold Calligraphy -->
      <circle cx="0" cy="0" r="48" fill="#FFFFFF" stroke="#991B1B" stroke-width="2.5" />
      <text x="0" y="14" font-family="'Noto Serif', serif" font-size="36" font-weight="900" fill="#991B1B" text-anchor="middle" letter-spacing="1">
        फट्
      </text>

      <!-- Pitha Label -->
      <text x="0" y="165" font-family="'Noto Serif', serif" font-size="13" font-weight="900" fill="#991B1B" text-anchor="middle">
        त्रैलोक्य रक्षा त्रिरिखा मण्डल (रक्त चन्दन एवं भस्म निर्मित)
      </text>
    </g>

    <!-- ============================================================== -->
    <!-- 3. REALISTIC THREE PARIDHIS RESTING ON TOP -->
    <!-- ============================================================== -->
    <g id="paridhi-vessel" filter="url(#patraDeepShadow)">
      
      <!-- Contact Shadow -->
      <ellipse cx="400" cy="335" rx="300" ry="70" fill="#0C1702" opacity="0.55" filter="url(#yantraGlowFilter)" />

      <!-- PARIDHI 1: मध्यमा परिधि (Central Longest Stick - 1 Bahu = ~36 Angulas = ~27 inches) -->
      <g transform="translate(130, 275)">
        <rect x="0" y="0" width="540" height="28" rx="14" fill="url(#greenPalashaBark)" stroke="#1A2E05" stroke-width="3" />
        <!-- Fresh cut ends with visible annular sapwood -->
        <ellipse cx="14" cy="14" rx="12" ry="12" fill="url(#woodCutEnd)" stroke="#1A2E05" stroke-width="1.5" />
        <ellipse cx="526" cy="14" rx="12" ry="12" fill="url(#woodCutEnd)" stroke="#1A2E05" stroke-width="1.5" />
        <!-- Green Palasha bark striations and natural growth lenticels -->
        <line x1="60" y1="8" x2="480" y2="8" stroke="#A3E635" stroke-width="2" opacity="0.75" />
        <line x1="80" y1="20" x2="460" y2="20" stroke="#1A2E05" stroke-width="2.5" opacity="0.8" />
        <!-- Tag text -->
        <text x="270" y="18" font-family="'Noto Serif', serif" font-size="10" font-weight="900" fill="#ECFCCB" text-anchor="middle">
          १. मध्यमा परिधि (पश्चिमा • १ बाहु दैर्घ्य)
        </text>
      </g>

      <!-- PARIDHI 2: दक्षिणा परिधि (South Stick - 1 Pradesha = ~12 Angulas) -->
      <g transform="translate(170, 320)">
        <rect x="0" y="0" width="460" height="26" rx="13" fill="url(#greenPalashaBark)" stroke="#1A2E05" stroke-width="3" />
        <ellipse cx="13" cy="13" rx="11" ry="11" fill="url(#woodCutEnd)" stroke="#1A2E05" stroke-width="1.5" />
        <ellipse cx="447" cy="13" rx="11" ry="11" fill="url(#woodCutEnd)" stroke="#1A2E05" stroke-width="1.5" />
        <line x1="50" y1="8" x2="410" y2="8" stroke="#A3E635" stroke-width="1.8" opacity="0.75" />
        <text x="230" y="17" font-family="'Noto Serif', serif" font-size="10" font-weight="900" fill="#ECFCCB" text-anchor="middle">
          २. दक्षिणा परिधि (१ प्रादेश दैर्घ्य)
        </text>
      </g>

      <!-- PARIDHI 3: उत्तरा परिधि (North Stick - 1 Pradesha = ~12 Angulas) -->
      <g transform="translate(210, 360)">
        <rect x="0" y="0" width="380" height="26" rx="13" fill="url(#greenPalashaBark)" stroke="#1A2E05" stroke-width="3" />
        <ellipse cx="13" cy="13" rx="11" ry="11" fill="url(#woodCutEnd)" stroke="#1A2E05" stroke-width="1.5" />
        <ellipse cx="367" cy="13" rx="11" ry="11" fill="url(#woodCutEnd)" stroke="#1A2E05" stroke-width="1.5" />
        <line x1="40" y1="8" x2="340" y2="8" stroke="#A3E635" stroke-width="1.8" opacity="0.75" />
        <text x="190" y="17" font-family="'Noto Serif', serif" font-size="10" font-weight="900" fill="#ECFCCB" text-anchor="middle">
          ३. उत्तरा परिधि (१ प्रादेश दैर्घ्य)
        </text>
      </g>
    </g>

    <!-- Dimension Marker Arrows -->
    <g opacity="0.85">
      <line x1="130" y1="215" x2="670" y2="215" stroke="#805713" stroke-width="2" />
      <polygon points="130,215 145,209 145,221" fill="#805713" />
      <polygon points="670,215 655,209 655,221" fill="#805713" />
      <rect x="300" y="201" width="200" height="26" rx="6" fill="#FFFDF8" stroke="#805713" stroke-width="1.2" />
      <text x="400" y="219" font-family="'Cinzel', 'Noto Serif', serif" font-size="13" font-weight="900" fill="#805713" text-anchor="middle">
        मध्यमा दैर्घ्य: ३६ अंगुल (१ बाहु)
      </text>
    </g>
  </g>

  <!-- BOTTOM BANNER -->
  <g transform="translate(500, 890)" text-anchor="middle">
    <rect x="-380" y="-45" width="760" height="75" rx="16" fill="#FFF9EB" stroke="#991B1B" stroke-width="2.2" />
    <text y="-20" font-family="'Noto Serif', serif" font-size="16" font-weight="900" fill="#991B1B">
      ✦ अधः-स्थापित पीठ: त्रैलोक्य रक्षा त्रिरिखा मण्डल (परिधि-प्रतिष्ठा) ✦
    </text>
    <text y="5" font-family="'Noto Serif', serif" font-size="13" font-weight="bold" fill="#7F1D1D">
      अङ्कन द्रव्य: रक्त चन्दन एवं भस्म | बीज मन्त्र: "ॐ फट् परिधिभ्यो नमः" | आकृति: त्रिरिखा एवं चतुस्त्रिशूल
    </text>
    <text y="24" font-family="'Noto Serif', serif" font-size="11" font-weight="bold" fill="#805713">
      *शतपथ ब्राह्मणम्* १.३.४: "गन्धर्वास्त्वा परिदधतु... रक्षसां भागोऽसीत्यपास्तेभ्यो रक्षणार्थम्"
    </text>
  </g>
</svg>

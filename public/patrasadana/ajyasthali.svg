<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FFFDF8" />
      <stop offset="60%" stop-color="#F5EBDC" />
      <stop offset="100%" stop-color="#E2D1B3" />
    </radialGradient>

    <!-- Kusha Mat Woven Texture -->
    <linearGradient id="kushaWeave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF4DE" />
      <stop offset="30%" stop-color="#D7E8BC" />
      <stop offset="70%" stop-color="#C2DC9A" />
      <stop offset="100%" stop-color="#A6C878" />
    </linearGradient>

    <pattern id="kushaPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 0,0 L 24,24 M 24,0 L 0,24" stroke="#8CAE5B" stroke-width="0.8" opacity="0.4" />
      <line x1="0" y1="12" x2="24" y2="12" stroke="#6C8E3B" stroke-width="0.6" opacity="0.35" />
      <line x1="12" y1="0" x2="12" y2="24" stroke="#5E7E2F" stroke-width="0.6" opacity="0.35" />
    </pattern>

    <!-- Sacred Turmeric / Haridra & Ashtagandha Paste for Surya-Chandra Mandala -->
    <radialGradient id="suryaAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0.08" />
    </radialGradient>

    <!-- Lustrous Kamsa (Bell-Metal / Bronze) Gradient -->
    <linearGradient id="bellMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#785012" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FFF0A3" />
      <stop offset="75%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#523405" />
    </linearGradient>

    <!-- Molten Golden Cow Ghee Pool with Translucent Glowing Sheen -->
    <radialGradient id="pureGheePool" cx="48%" cy="40%" r="62%">
      <stop offset="0%" stop-color="#FFFDE7" />
      <stop offset="25%" stop-color="#FEF08A" />
      <stop offset="60%" stop-color="#FACC15" />
      <stop offset="85%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </radialGradient>

    <!-- Filters -->
    <filter id="yantraGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="patraDeepShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="8" dy="24" stdDeviation="16" flood-color="#2D1A04" flood-opacity="0.55" />
      <feDropShadow dx="2" dy="6" stdDeviation="6" flood-color="#422506" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="1000" fill="url(#bgGrad)" />

  <!-- Outer Temple Border -->
  <rect x="30" y="30" width="940" height="940" rx="24" fill="none" stroke="#C5A059" stroke-width="2" stroke-dasharray="8 6" opacity="0.7" />
  <rect x="42" y="42" width="916" height="916" rx="18" fill="none" stroke="#805713" stroke-width="3" opacity="0.85" />

  <!-- HEADER: Ajyasthali Identity & Purpose -->
  <g transform="translate(500, 85)" text-anchor="middle">
    <rect x="-240" y="-30" width="480" height="42" rx="21" fill="#805713" stroke="#FDE68A" stroke-width="1.8" />
    <text y="-3" font-family="'Cinzel', 'Noto Serif', serif" font-size="18" font-weight="900" fill="#FFFDF8" letter-spacing="2">
      ॥ आज्यस्थाली • शुद्ध कांस्य (कांसा) ॥
    </text>
    <text y="32" font-family="'Noto Serif', serif" font-size="14" font-weight="bold" fill="#6A1B07">
      मानक प्रमाण: परिमण्डल (गोल पात्र • १ प्रस्थ क्षमता) | शुद्ध गोघृत पात्र
    </text>
  </g>

  <!-- ============================================================== -->
  <!-- 1. KUSHA MAT BED (कुश-आस्तरण वेदी) -->
  <!-- ============================================================== -->
  <g transform="translate(100, 160)">
    <rect x="0" y="0" width="800" height="640" rx="28" fill="url(#kushaWeave)" stroke="#558B2F" stroke-width="3" />
    <rect x="0" y="0" width="800" height="640" rx="28" fill="url(#kushaPattern)" />
    <rect x="12" y="12" width="776" height="616" rx="20" fill="none" stroke="#33691E" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6" />

    <!-- Akshata Grains on Mat -->
    <g fill="#FFFDF5" stroke="#D97706" stroke-width="0.6" opacity="0.85">
      <ellipse cx="80" cy="85" rx="3.5" ry="1.8" transform="rotate(25 80 85)" />
      <ellipse cx="95" cy="80" rx="3.8" ry="1.7" transform="rotate(-30 95 80)" />
      <ellipse cx="715" cy="85" rx="3.6" ry="1.8" transform="rotate(40 715 85)" />
      <ellipse cx="725" cy="545" rx="3.7" ry="1.8" transform="rotate(15 725 545)" />
      <ellipse cx="85" cy="555" rx="3.5" ry="1.7" transform="rotate(-20 85 555)" />
    </g>

    <!-- ============================================================== -->
    <!-- 2. UNDERLYING YANTRA: द्वादशार सूर्य-सोम मण्डल (12-Spoke Sun Mandala) -->
    <!-- ============================================================== -->
    <!-- Sharadatilakam Patala 4: "द्वादशारं सूर्यमण्डलं हरिद्रया विरचितं... ह्रीं-बीजेन समन्विते आज्यस्थालीं न्यसेत्" -->
    <g id="underlying-yantra-ajyasthali" transform="translate(400, 320)" filter="url(#yantraGlowFilter)">
      <!-- Radiant Golden Aura -->
      <circle cx="0" cy="0" r="235" fill="url(#suryaAura)" opacity="0.45" />

      <!-- Outer Lotus Ring drawn in Turmeric & Ashtagandha -->
      <circle cx="0" cy="0" r="215" fill="none" stroke="#D97706" stroke-width="2.5" stroke-dasharray="8 4" opacity="0.75" />
      <circle cx="0" cy="0" r="195" fill="#FFFBEB" stroke="#B45309" stroke-width="3.5" opacity="0.85" />

      <!-- 12 Solar Rays (द्वादश सूर्य किरण / दल) drawn in Haridra paste -->
      <g stroke="#D97706" stroke-width="2.5" fill="#FEF08A">
        <!-- 12 spokes radiating every 30 degrees -->
        <polygon points="0,-195 14,-140 -14,-140" />
        <polygon points="0,195 14,140 -14,140" />
        <polygon points="-195,0 -140,14 -140,-14" />
        <polygon points="195,0 140,14 140,-14" />
        <polygon points="97,-168 85,-115 62,-132" />
        <polygon points="-97,-168 -85,-115 -62,-132" />
        <polygon points="97,168 85,115 62,132" />
        <polygon points="-97,168 -85,115 -62,132" />
        <polygon points="168,-97 115,-85 132,-62" />
        <polygon points="-168,-97 -115,-85 -132,-62" />
        <polygon points="168,97 115,85 132,62" />
        <polygon points="-168,97 -115,85 -132,62" />
      </g>

      <!-- Middle Circle with Consecrated Akshata -->
      <circle cx="0" cy="0" r="140" fill="#FFFDE7" stroke="#F59E0B" stroke-width="2" />
      <circle cx="0" cy="0" r="105" fill="#FEF08A" stroke="#B45309" stroke-width="2" />

      <!-- Central Luminous Circle with Sacred Beeja Mantra: ह्रीं (Surya/Bhuvaneshwari Beeja) -->
      <circle cx="0" cy="0" r="62" fill="#FFFFFF" stroke="#92400E" stroke-width="2.5" />
      <text x="0" y="14" font-family="'Noto Serif', serif" font-size="38" font-weight="900" fill="#92400E" text-anchor="middle" letter-spacing="1">
        ह्रीं
      </text>

      <!-- Pitha Label -->
      <text x="0" y="165" font-family="'Noto Serif', serif" font-size="13" font-weight="900" fill="#92400E" text-anchor="middle">
        द्वादशार सूर्य-सोम मण्डल (हरिद्रा एवं अष्टगन्ध निर्मित)
      </text>
    </g>

    <!-- ============================================================== -->
    <!-- 3. REALISTIC BRONZE AJYASTHALI RESTING ON TOP OF MANDALA -->
    <!-- ============================================================== -->
    <g id="ajyasthali-vessel" filter="url(#patraDeepShadow)">
      
      <!-- Contact Shadow onto Yantra -->
      <ellipse cx="400" cy="335" rx="210" ry="60" fill="#261403" opacity="0.55" filter="url(#yantraGlowFilter)" />

      <!-- Vessel Bottom Ring / Pedestal (कांस्य पीठिका) -->
      <ellipse cx="400" cy="425" rx="140" ry="32" fill="#523405" stroke="#261403" stroke-width="3" />
      <ellipse cx="400" cy="425" rx="140" ry="32" fill="url(#bellMetal)" opacity="0.6" />

      <!-- Spherical Bowl Belly (कांस्य घट कुक्षि) -->
      <path d="M 230,270 
               C 170,330, 200,410, 260,425
               L 540,425
               C 600,410, 630,330, 570,270
               Z" 
            fill="url(#bellMetal)" stroke="#3D2003" stroke-width="4" />

      <!-- Circular Flanged Beveled Rim (विशाल कांस्य मुख) -->
      <ellipse cx="400" cy="270" rx="175" ry="52" fill="url(#bellMetal)" stroke="#3D2003" stroke-width="3" />
      <ellipse cx="400" cy="270" rx="160" ry="46" fill="#422506" stroke="#261403" stroke-width="2" />

      <!-- Inner Cavity with Molten Cow Ghee (शुद्ध गोघृत) -->
      <ellipse cx="400" cy="272" rx="148" ry="40" fill="url(#pureGheePool)" stroke="#B45309" stroke-width="2" />

      <!-- Liquid Ghee Surface Shimmer & Specular Flare -->
      <ellipse cx="370" cy="265" rx="75" ry="16" fill="#FFFFFF" opacity="0.8" />
      <path d="M 290,275 C 340,265, 460,265, 510,275" stroke="#FFFFFF" stroke-width="2.5" fill="none" opacity="0.75" />

      <!-- Two Sacred Kusha Pavitris Dipping into the Ghee for Utpavana (उत्पवन पवित्री) -->
      <g>
        <path d="M 280,240 C 330,260, 380,285, 450,285" stroke="#65A30D" stroke-width="6" stroke-linecap="round" fill="none" />
        <circle cx="370" cy="272" r="8" fill="#FACC15" stroke="#4D7C0F" stroke-width="1.8" />
        <path d="M 450,285 C 475,282, 500,278, 520,270" stroke="#84CC16" stroke-width="3.5" fill="none" stroke-linecap="round" />
        
        <!-- Sacred Kusha Knot Knotting Utpavana pavitris -->
        <ellipse cx="370" cy="272" rx="6" ry="10" fill="#FDE047" stroke="#4D7C0F" stroke-width="1" />
      </g>
    </g>

    <!-- Dimension Marker Arrows -->
    <g opacity="0.85">
      <line x1="225" y1="195" x2="575" y2="195" stroke="#805713" stroke-width="2" />
      <polygon points="225,195 240,189 240,201" fill="#805713" />
      <polygon points="575,195 560,189 560,201" fill="#805713" />
      <rect x="300" y="181" width="200" height="26" rx="6" fill="#FFFDF8" stroke="#805713" stroke-width="1.2" />
      <text x="400" y="199" font-family="'Cinzel', 'Noto Serif', serif" font-size="13" font-weight="900" fill="#805713" text-anchor="middle">
        व्यास: ८ अंगुल (६ इंच)
      </text>
    </g>
  </g>

  <!-- BOTTOM BANNER -->
  <g transform="translate(500, 890)" text-anchor="middle">
    <rect x="-380" y="-45" width="760" height="75" rx="16" fill="#FFF9EB" stroke="#D97706" stroke-width="2.2" />
    <text y="-20" font-family="'Noto Serif', serif" font-size="16" font-weight="900" fill="#92400E">
      ✦ अधः-स्थापित पीठ: द्वादशार सूर्य-सोम मण्डल (आज्यस्थाली-प्रतिष्ठा) ✦
    </text>
    <text y="5" font-family="'Noto Serif', serif" font-size="13" font-weight="bold" fill="#78350F">
      अङ्कन द्रव्य: हरिद्रा (हल्दी) एवं अष्टगन्ध | बीज मन्त्र: "ॐ ह्रीं आज्यस्थाल्पै नमः" | आकृति: १२ किरण युक्त सूर्य-चक्र
    </text>
    <text y="24" font-family="'Noto Serif', serif" font-size="11" font-weight="bold" fill="#805713">
      *शारदातिलकम्* पटल ४: "आज्यस्य धारणं सौरे मण्डले विधिवच्चरेत्... ह्रीं-बीजेन समन्विते"
    </text>
  </g>
</svg>

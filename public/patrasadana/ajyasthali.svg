<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="60%" stop-color="#F7EEDF" />
      <stop offset="100%" stop-color="#EADBBE" />
    </radialGradient>

    <!-- Bell Metal / Pure Bronze (कांस्य) Gradient -->
    <linearGradient id="bronzeVessel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="25%" stop-color="#AA7C11" />
      <stop offset="55%" stop-color="#7B5606" />
      <stop offset="85%" stop-color="#A57A15" />
      <stop offset="100%" stop-color="#4C3401" />
    </linearGradient>

    <linearGradient id="bronzeShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5DE88" />
      <stop offset="50%" stop-color="#FFF8D6" />
      <stop offset="100%" stop-color="#C59B27" />
    </linearGradient>

    <!-- Golden Molten Ghee Surface -->
    <radialGradient id="gheePool" cx="48%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#FFFDE7" />
      <stop offset="35%" stop-color="#FCD34D" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </radialGradient>

    <!-- Flaming Ulmuka (जलती तृण-ज्वाला) for Ghee Purification -->
    <linearGradient id="ulmukaFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="40%" stop-color="#F97316" />
      <stop offset="80%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <filter id="patraShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="16" flood-color="#402902" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#bgGrad)" />

  <!-- Outer Sacred Geometry Frame -->
  <rect x="35" y="35" width="930" height="930" rx="28" fill="none" stroke="#C5A059" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />
  <rect x="50" y="50" width="900" height="900" rx="22" fill="none" stroke="#805713" stroke-width="3" opacity="0.8" />
  <circle cx="500" cy="500" r="410" fill="none" stroke="#C5A059" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.45" />

  <!-- Dimensions Indicator -->
  <g opacity="0.7">
    <line x1="300" y1="230" x2="700" y2="230" stroke="#805713" stroke-width="1.5" />
    <path d="M 300 230 L 315 224 L 315 236 Z" fill="#805713" />
    <path d="M 700 230 L 685 224 L 685 236 Z" fill="#805713" />
    <text x="500" y="215" font-family="'Cinzel', 'Noto Serif', serif" font-size="16" font-weight="bold" fill="#805713" text-anchor="middle" letter-spacing="1">
      मानक कांस्य प्रमाण: विस्तृत मुख युक्त शुद्ध घृत कुम्भ
    </text>
  </g>

  <!-- AJYASTHALI (Sacred Bell-Metal Ghee Pot) -->
  <g filter="url(#patraShadow)">
    
    <!-- Base Foot / Pedestal (कुम्भ पाद) -->
    <ellipse cx="500" cy="655" rx="145" ry="32" fill="url(#bronzeVessel)" stroke="#4A3302" stroke-width="3" />
    <ellipse cx="500" cy="652" rx="135" ry="24" fill="#382601" />

    <!-- Main Spherical Belly of Vessel (कुम्भ उदर) -->
    <path d="M 355 640
             C 270 580, 260 480, 310 420
             C 330 395, 360 380, 400 375
             L 600 375
             C 640 380, 670 395, 690 420
             C 740 480, 730 580, 645 640
             Z"
          fill="url(#bronzeVessel)" stroke="#382601" stroke-width="4" />

    <!-- Ornate Sacred Engravings on Vessel Waist -->
    <!-- Gold Relief Filigree Band -->
    <path d="M 285 510 C 370 540, 630 540, 715 510" stroke="url(#bronzeShine)" stroke-width="6" fill="none" opacity="0.85" />
    <path d="M 282 525 C 370 555, 630 555, 718 525" stroke="#3D2A02" stroke-width="2.5" fill="none" />
    <!-- Lotus Petal Engraving on Base -->
    <g fill="#D4AF37" opacity="0.75" stroke="#4C3401" stroke-width="1">
      <path d="M 370 635 C 385 615, 405 615, 420 635 Z" />
      <path d="M 420 635 C 435 615, 455 615, 470 635 Z" />
      <path d="M 470 635 C 485 615, 505 615, 520 635 Z" />
      <path d="M 520 635 C 535 615, 555 615, 570 635 Z" />
      <path d="M 570 635 C 585 615, 605 615, 620 635 Z" />
    </g>

    <!-- Wide Flared Neck & Rim (कण्ठ एवं विस्तृत मुख) -->
    <!-- Outer Rim Flare -->
    <ellipse cx="500" cy="375" rx="195" ry="65" fill="url(#bronzeShine)" stroke="#382601" stroke-width="4" />

    <!-- Inner Cavity with Molten Golden Desi Cow Ghee (शुद्ध गोघृत) -->
    <ellipse cx="500" cy="380" rx="170" ry="52" fill="url(#gheePool)" stroke="#854D0E" stroke-width="3" />

    <!-- Golden Ghee Surface Shimmer & Concentric Radiance -->
    <ellipse cx="485" cy="375" rx="110" ry="28" fill="#FEF9C3" opacity="0.55" />
    <ellipse cx="470" cy="370" rx="55" ry="14" fill="#FFFFFF" opacity="0.8" />

    <!-- Sacred Two Kusha Pavatris Dipping in Ghee for Utpavana (उत्पवन पवित्री द्वय) -->
    <g filter="url(#patraShadow)">
      <path d="M 410 440 C 440 395, 470 365, 530 330" stroke="#65A30D" stroke-width="5" stroke-linecap="round" fill="none" />
      <circle cx="480" cy="370" r="7" fill="#FACC15" stroke="#365314" stroke-width="1.2" />
      <path d="M 530 330 C 545 320, 565 315, 580 305" stroke="#84CC16" stroke-width="3" fill="none" stroke-linecap="round" />

      <path d="M 440 445 C 470 405, 510 380, 560 345" stroke="#65A30D" stroke-width="4.5" stroke-linecap="round" fill="none" />
      <circle cx="505" cy="385" r="6" fill="#FACC15" stroke="#365314" stroke-width="1.2" />
      <path d="M 560 345 C 575 338, 595 330, 610 320" stroke="#84CC16" stroke-width="2.8" fill="none" stroke-linecap="round" />
    </g>

    <!-- Flaming Sacred Ulmuka Encircling (उल्मुक प्रदक्षिणा - अग्नि शोधन) -->
    <!-- Burning Kusha Grass Torch circling above the pot -->
    <g transform="translate(620, 270)">
      <!-- Burning Grass Twig -->
      <path d="M -10 60 C 20 40, 50 20, 70 -10" stroke="#78350F" stroke-width="4.5" stroke-linecap="round" fill="none" />
      <!-- Fire Flames -->
      <path d="M 70 -10 
               C 85 -30, 95 -60, 85 -80 
               C 70 -65, 60 -50, 55 -40 
               C 50 -60, 40 -75, 25 -90 
               C 20 -70, 25 -50, 30 -35 
               C 15 -45, 0 -50, -10 -40
               C 5 -20, 30 -10, 70 -10 Z" 
            fill="url(#ulmukaFlame)" filter="url(#patraShadow)" />
      <!-- Fire Sparks (अग्नि कण) -->
      <circle cx="95" cy="-85" r="4" fill="#FACC15" />
      <circle cx="35" cy="-100" r="3.5" fill="#FDE047" />
      <circle cx="70" cy="-110" r="2.5" fill="#FFFFFF" />
    </g>

    <!-- Circumambulation Arc Guide (प्रदक्षिणा रेखा) -->
    <path d="M 330 330 C 420 280, 580 280, 670 330" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 6" fill="none" opacity="0.75" />

  </g>

  <!-- Sacred Details & Typography -->
  <g transform="translate(500, 750)" text-anchor="middle">
    <text y="0" font-family="'Cinzel', 'Noto Serif', serif" font-size="34" font-weight="900" fill="#6A1B07" letter-spacing="2">
      आज्यस्थाली (AJYASTHALI)
    </text>
    <text y="30" font-family="'Noto Serif', serif" font-size="18" font-weight="bold" fill="#805713">
      विशुद्ध कांस्य निर्मित • गोघृत धारण, उल्मुक शोधन एवं उत्पवन पात्र
    </text>

    <!-- Citation Box -->
    <rect x="-380" y="55" width="760" height="95" rx="14" fill="#F5E8D3" stroke="#C5A059" stroke-width="1.5" opacity="0.9" />
    <text y="85" font-family="'Noto Serif', serif" font-size="16" font-style="italic" fill="#521706">
      "मही द्यौः पृथिवी च न इमं यज्ञं मिमिक्षताम्... आज्यस्थाल्यै नमः ॥"
    </text>
    <text y="115" font-family="'Noto Serif', serif" font-size="13" font-weight="600" fill="#7D6B57">
      — कात्यायन श्रौतसूत्र १.३ • दो कुश-पवित्रियों द्वारा त्रिवार घृत-उत्पवन विधान
    </text>
  </g>

  <!-- Top Badges -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="160" height="42" rx="10" fill="#EFE3CB" stroke="#805713" stroke-width="1.5" />
    <text x="80" y="26" font-family="monospace" font-size="13" font-weight="bold" fill="#805713" text-anchor="middle">
      कांस्य घृत कुम्भ
    </text>
  </g>
  <g transform="translate(740, 100)">
    <rect x="0" y="0" width="160" height="42" rx="10" fill="#EFE3CB" stroke="#805713" stroke-width="1.5" />
    <text x="80" y="26" font-family="monospace" font-size="13" font-weight="bold" fill="#805713" text-anchor="middle">
      उल्मुक-उत्पवन
    </text>
  </g>

</svg>

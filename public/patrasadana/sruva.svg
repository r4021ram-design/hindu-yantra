<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="60%" stop-color="#F7EEDF" />
      <stop offset="100%" stop-color="#EADBBE" />
    </radialGradient>

    <!-- Khadira Sacred Ironwood Gradient (Dark Reddish Mahogany) -->
    <linearGradient id="khadiraWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78281F" />
      <stop offset="30%" stop-color="#511811" />
      <stop offset="60%" stop-color="#340E0A" />
      <stop offset="85%" stop-color="#511811" />
      <stop offset="100%" stop-color="#240705" />
    </linearGradient>

    <linearGradient id="khadiraHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#943126" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#4A140F" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1F0604" stop-opacity="0.9" />
    </linearGradient>

    <!-- Sacred Golden Ghee in Bowl -->
    <radialGradient id="gheeBowlGlow" cx="45%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="35%" stop-color="#FBBF24" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </radialGradient>

    <!-- Gold Accent -->
    <linearGradient id="sruvaGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B48222" />
      <stop offset="50%" stop-color="#FDF0A6" />
      <stop offset="100%" stop-color="#936814" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="patraShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="8" dy="16" stdDeviation="12" flood-color="#3B100B" flood-opacity="0.38" />
    </filter>
    <filter id="bowlDepth">
      <feOffset dx="2" dy="4" />
      <feGaussianBlur stdDeviation="3.5" result="offset-blur" />
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse" />
      <feFlood flood-color="#1A0503" flood-opacity="0.8" result="color" />
      <feComposite operator="in" in="color" in2="inverse" result="shadow" />
      <feComposite operator="over" in="shadow" in2="SourceGraphic" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#bgGrad)" />

  <!-- Outer Sacred Geometry Frame -->
  <rect x="35" y="35" width="930" height="930" rx="28" fill="none" stroke="#C5A059" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />
  <rect x="50" y="50" width="900" height="900" rx="22" fill="none" stroke="#805713" stroke-width="3" opacity="0.8" />
  <circle cx="500" cy="500" r="410" fill="none" stroke="#C5A059" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.45" />

  <!-- Dimension Guide Lines & Annotation -->
  <g opacity="0.7">
    <line x1="160" y1="500" x2="840" y2="500" stroke="#805713" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="150" y1="210" x2="850" y2="210" stroke="#805713" stroke-width="1.5" />
    <path d="M 150 210 L 165 204 L 165 216 Z" fill="#805713" />
    <path d="M 850 210 L 835 204 L 835 216 Z" fill="#805713" />
    <text x="500" y="195" font-family="'Cinzel', 'Noto Serif', serif" font-size="16" font-weight="bold" fill="#805713" text-anchor="middle" letter-spacing="1">
      मानक प्रमाण: १ अरत्नि (२४ अंगुल • १८ इंच • ४५.७ सेमी)
    </text>
  </g>

  <!-- SRUVA BODY (Left Tail Grip to Right Round Bowl) -->
  <g filter="url(#patraShadow)">
    
    <!-- Tail Finial Knot (ग्रन्थि / मुकुट) -->
    <path d="M 160 500
             C 160 480, 175 465, 195 465
             C 210 465, 220 480, 220 500
             C 220 520, 210 535, 195 535
             C 175 535, 160 520, 160 500 Z"
          fill="url(#khadiraWood)" stroke="#260805" stroke-width="3" />
    <!-- Finial Diamond Carving -->
    <polygon points="195,475 207,500 195,525 183,500" fill="url(#sruvaGold)" stroke="#381008" stroke-width="1" />

    <!-- Long Slender Shaft (दण्ड) -->
    <path d="M 220 491
             C 340 490, 520 488, 700 485
             L 700 515
             C 520 512, 340 510, 220 509
             Z"
          fill="url(#khadiraHighlight)" stroke="#2A0805" stroke-width="3" />

    <!-- Wood grain on Danda -->
    <path d="M 240 496 C 380 495, 540 493, 680 490" stroke="#BA4A38" stroke-width="1.2" fill="none" opacity="0.65" />
    <path d="M 250 505 C 390 505, 550 505, 680 508" stroke="#1F0604" stroke-width="1.8" fill="none" opacity="0.75" />

    <!-- Gold Accent Bindings on Shaft -->
    <rect x="320" y="489" width="12" height="22" rx="3" fill="url(#sruvaGold)" stroke="#5B190E" stroke-width="0.8" />
    <rect x="460" y="487" width="14" height="26" rx="3" fill="url(#sruvaGold)" stroke="#5B190E" stroke-width="0.8" />
    <rect x="600" y="486" width="16" height="28" rx="3" fill="url(#sruvaGold)" stroke="#5B190E" stroke-width="0.8" />

    <!-- Neck Transition to Bowl (ग्रीवा) -->
    <path d="M 700 485
             C 715 484, 725 470, 735 455
             C 742 445, 750 440, 760 440
             L 760 560
             C 750 560, 742 555, 735 545
             C 725 530, 715 516, 700 515
             Z"
          fill="url(#khadiraWood)" stroke="#260805" stroke-width="2.5" />

    <!-- Circular Bowl (पुष्कर - Round Cup, व्यास २ अंगुल = १.५″) -->
    <!-- Outer Rim -->
    <circle cx="785" cy="500" r="75" fill="url(#khadiraWood)" stroke="#240705" stroke-width="4" filter="url(#bowlDepth)" />
    
    <!-- Bowl Lip / Wall -->
    <circle cx="785" cy="500" r="62" fill="#42120C" stroke="#260805" stroke-width="2" />

    <!-- Inner Golden Ghee Cavity (घृत पुष्कर) -->
    <circle cx="785" cy="500" r="54" fill="url(#gheeBowlGlow)" stroke="#78350F" stroke-width="2" />

    <!-- Concentric Radiance & Surface Tension in Ghee -->
    <ellipse cx="782" cy="495" rx="38" ry="34" fill="#FEF08A" opacity="0.6" />
    <circle cx="780" cy="492" r="16" fill="#FFFBEB" opacity="0.8" />

    <!-- Pointed Pouring Nock / Beak (चमसोष्ठ) -->
    <path d="M 855 490 C 868 495, 878 500, 868 505 C 855 510, 850 500, 855 490 Z" fill="url(#khadiraWood)" stroke="#2A0805" stroke-width="2" />

    <!-- Suspended Golden Ghee Oblation Droplet (आहुति बिन्दु) -->
    <path d="M 872 500 C 885 500, 895 506, 895 515 C 895 525, 885 532, 876 532 C 868 532, 865 522, 865 515 C 865 506, 868 500, 872 500 Z"
          fill="url(#sruvaGold)" stroke="#B45309" stroke-width="1.5" />
    <circle cx="880" cy="514" r="3" fill="#FFFBEB" />

  </g>

  <!-- Sacred Details & Typography -->
  <g transform="translate(500, 750)" text-anchor="middle">
    <text y="0" font-family="'Cinzel', 'Noto Serif', serif" font-size="34" font-weight="900" fill="#4A140F" letter-spacing="2">
      खदिर स्रुवा (SRUVA)
    </text>
    <text y="30" font-family="'Noto Serif', serif" font-size="18" font-weight="bold" fill="#805713">
      इन्द्र-वीर्य खदिर काष्ठ निर्मित • सर्वप्रधान नित्य आहुति दण्ड
    </text>

    <!-- Citation Box -->
    <rect x="-380" y="55" width="760" height="95" rx="14" fill="#F5E8D3" stroke="#C5A059" stroke-width="1.5" opacity="0.9" />
    <text y="85" font-family="'Noto Serif', serif" font-size="16" font-style="italic" fill="#3D100A">
      "उपभृदसि घृताची नाम्ना प्रियेण नाम्ना प्रियं सद आसीद ॥"
    </text>
    <text y="115" font-family="'Noto Serif', serif" font-size="13" font-weight="600" fill="#7D6B57">
      — शतपथ १.३.२ • गोल पुष्कर युक्त १ अरत्नि प्रमाण (अग्र कटोरा व्यास २ अंगुल)
    </text>
  </g>

  <!-- Top Badges -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="160" height="42" rx="10" fill="#EFE3CB" stroke="#805713" stroke-width="1.5" />
    <text x="80" y="26" font-family="monospace" font-size="13" font-weight="bold" fill="#805713" text-anchor="middle">
      स्रुक्-स्रुवा युगल
    </text>
  </g>
  <g transform="translate(740, 100)">
    <rect x="0" y="0" width="160" height="42" rx="10" fill="#EFE3CB" stroke="#805713" stroke-width="1.5" />
    <text x="80" y="26" font-family="monospace" font-size="13" font-weight="bold" fill="#805713" text-anchor="middle">
      वृत्ताकार पुष्कर
    </text>
  </g>

</svg>

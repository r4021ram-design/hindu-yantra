<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FFFDF8" />
      <stop offset="60%" stop-color="#F5EBDC" />
      <stop offset="100%" stop-color="#E2D1B3" />
    </radialGradient>

    <!-- Kusha Mat Woven Texture -->
    <linearGradient id="kushaWeave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF4DE" />
      <stop offset="30%" stop-color="#D7E8BC" />
      <stop offset="70%" stop-color="#C2DC9A" />
      <stop offset="100%" stop-color="#A6C878" />
    </linearGradient>

    <pattern id="kushaPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 0,0 L 24,24 M 24,0 L 0,24" stroke="#8CAE5B" stroke-width="0.8" opacity="0.4" />
      <line x1="0" y1="12" x2="24" y2="12" stroke="#6C8E3B" stroke-width="0.6" opacity="0.35" />
      <line x1="12" y1="0" x2="12" y2="24" stroke="#5E7E2F" stroke-width="0.6" opacity="0.35" />
    </pattern>

    <!-- Sacred Vayavya Sindoor & Kumkum Paste -->
    <radialGradient id="vayuAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FECDD3" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#F43F5E" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#9F1239" stop-opacity="0.08" />
    </radialGradient>

    <!-- Khadira Hardwood (Acacia catechu) for Wooden Sword -->
    <linearGradient id="khadiraSword" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#5B2912" />
      <stop offset="25%" stop-color="#3D1808" />
      <stop offset="50%" stop-color="#240D04" />
      <stop offset="75%" stop-color="#421B09" />
      <stop offset="100%" stop-color="#190702" />
    </linearGradient>

    <linearGradient id="bladeBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97746" stop-opacity="0.75" />
      <stop offset="35%" stop-color="#8C3512" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#240D04" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#120401" stop-opacity="0.95" />
    </linearGradient>

    <!-- Filters -->
    <filter id="yantraGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="patraDeepShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="8" dy="24" stdDeviation="16" flood-color="#1A0702" flood-opacity="0.6" />
      <feDropShadow dx="2" dy="6" stdDeviation="6" flood-color="#2B0E05" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="1000" fill="url(#bgGrad)" />

  <!-- Outer Traditional Temple Border -->
  <rect x="30" y="30" width="940" height="940" rx="24" fill="none" stroke="#C5A059" stroke-width="2" stroke-dasharray="8 6" opacity="0.7" />
  <rect x="42" y="42" width="916" height="916" rx="18" fill="none" stroke="#805713" stroke-width="3" opacity="0.85" />

  <!-- HEADER: Sphya Identity & Measures -->
  <g transform="translate(500, 85)" text-anchor="middle">
    <rect x="-240" y="-30" width="480" height="42" rx="21" fill="#805713" stroke="#FDE68A" stroke-width="1.8" />
    <text y="-3" font-family="'Cinzel', 'Noto Serif', serif" font-size="18" font-weight="900" fill="#FFFDF8" letter-spacing="2">
      ॥ स्फ्यः (काष्ठ-खड्ग) • खदिर काष्ठ ॥
    </text>
    <text y="32" font-family="'Noto Serif', serif" font-size="14" font-weight="bold" fill="#6A1B07">
      मानक प्रमाण: १ अरत्नि (२४ अंगुल • १८ इंच • ४५.७ सेमी) | खड्गाकार तीक्ष्ण धार • उल्लेखन अस्त्र
    </text>
  </g>

  <!-- ============================================================== -->
  <!-- 1. KUSHA MAT BED (कुश-आस्तरण वेदी) -->
  <!-- ============================================================== -->
  <g transform="translate(100, 160)">
    <rect x="0" y="0" width="800" height="640" rx="28" fill="url(#kushaWeave)" stroke="#558B2F" stroke-width="3" />
    <rect x="0" y="0" width="800" height="640" rx="28" fill="url(#kushaPattern)" />
    <rect x="12" y="12" width="776" height="616" rx="20" fill="none" stroke="#33691E" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6" />

    <!-- Akshata Grains on Mat -->
    <g fill="#FFFDF5" stroke="#D97706" stroke-width="0.6" opacity="0.85">
      <ellipse cx="80" cy="85" rx="3.5" ry="1.8" transform="rotate(25 80 85)" />
      <ellipse cx="95" cy="80" rx="3.8" ry="1.7" transform="rotate(-30 95 80)" />
      <ellipse cx="715" cy="85" rx="3.6" ry="1.8" transform="rotate(40 715 85)" />
      <ellipse cx="725" cy="545" rx="3.7" ry="1.8" transform="rotate(15 725 545)" />
      <ellipse cx="85" cy="555" rx="3.5" ry="1.7" transform="rotate(-20 85 555)" />
    </g>

    <!-- ============================================================== -->
    <!-- 2. UNDERLYING YANTRA: वायव्य वज्र-षट्कोण यन्त्र (Vajra Hexagram) -->
    <!-- ============================================================== -->
    <!-- Sharadatilakam Patala 4: "वायव्यं वज्रमण्डलं... यं-बीजेन समन्विते स्फ्यं सादयति" -->
    <g id="underlying-yantra-sphya" transform="translate(400, 320)" filter="url(#yantraGlowFilter)">
      <!-- Radiant Rosy-Crimson Aura -->
      <circle cx="0" cy="0" r="235" fill="url(#vayuAura)" opacity="0.45" />

      <!-- Concentric Protection Borders -->
      <circle cx="0" cy="0" r="215" fill="none" stroke="#BE123C" stroke-width="2.5" stroke-dasharray="8 4" opacity="0.75" />
      <circle cx="0" cy="0" r="195" fill="#FFF1F2" stroke="#E11D48" stroke-width="3" opacity="0.85" />

      <!-- Shatkona Hexagram drawn in Sindoor & Kumkum -->
      <polygon points="0,-165 142,82 -142,82" fill="#FFE4E6" stroke="#9F1239" stroke-width="4.5" />
      <polygon points="0,165 142,-82 -142,-82" fill="none" stroke="#9F1239" stroke-width="4.5" />

      <!-- 6 Double-Vajra Points (षड्वज्र शूल) at the 6 Vertices -->
      <g stroke="#881337" stroke-width="2" fill="#FDA4AF">
        <path d="M 0,-165 L -10,-190 L 0,-205 L 10,-190 Z" />
        <path d="M 0,165 L -10,190 L 0,205 L 10,190 Z" />
        <path d="M 142,82 L 165,95 L 180,90 L 165,75 Z" />
        <path d="M -142,82 L -165,95 L -180,90 L -165,75 Z" />
        <path d="M 142,-82 L 165,-95 L 180,-90 L 165,-75 Z" />
        <path d="M -142,-82 L -165,-95 L -180,-90 L -165,-75 Z" />
      </g>

      <!-- Central Sacred Circle & Vayu Beeja Mantra यं -->
      <circle cx="0" cy="0" r="54" fill="#FFFFFF" stroke="#9F1239" stroke-width="2.5" />
      <text x="0" y="12" font-family="'Noto Serif', serif" font-size="38" font-weight="900" fill="#9F1239" text-anchor="middle" letter-spacing="1">
        यं
      </text>

      <!-- Pitha Label -->
      <text x="0" y="165" font-family="'Noto Serif', serif" font-size="13" font-weight="900" fill="#9F1239" text-anchor="middle">
        वायव्य वज्र-षट्कोण यन्त्रपीठ (सिन्दूर एवं कुङ्कुम निर्मित)
      </text>
    </g>

    <!-- ============================================================== -->
    <!-- 3. REALISTIC KHADIRA SPHYA (WOODEN SWORD) RESTING ON TOP -->
    <!-- ============================================================== -->
    <g id="sphya-vessel" filter="url(#patraDeepShadow)">
      
      <!-- Contact Shadow -->
      <ellipse cx="400" cy="335" rx="310" ry="24" fill="#140602" opacity="0.55" filter="url(#yantraGlowFilter)" />

      <!-- Handle Pommel (खड्ग-मुष्टि / ग्रन्थि) -->
      <circle cx="120" cy="315" r="28" fill="url(#khadiraSword)" stroke="#190702" stroke-width="3" />
      <circle cx="120" cy="315" r="14" fill="#A6C878" stroke="#190702" stroke-width="2" opacity="0.8" />
      <circle cx="120" cy="315" r="28" fill="url(#bladeBevel)" opacity="0.6" />

      <!-- Grip / Hilt with Ergonomic Finger Grooves -->
      <path d="M 145,296 
               C 170,294, 190,292, 215,290
               L 215,340
               C 190,338, 170,336, 145,334
               Z" 
            fill="url(#khadiraSword)" stroke="#190702" stroke-width="3" />

      <!-- Carved Leather/Cord Wrappings on Hilt -->
      <line x1="165" y1="294" x2="165" y2="336" stroke="#D97746" stroke-width="3" />
      <line x1="185" y1="293" x2="185" y2="337" stroke="#D97746" stroke-width="3" />
      <line x1="205" y1="291" x2="205" y2="339" stroke="#D97746" stroke-width="3" />

      <!-- Sword Guard / Crossbar (खड्ग-त्सरु) -->
      <polygon points="215,275 235,275 235,355 215,355" fill="url(#khadiraSword)" stroke="#190702" stroke-width="2.5" />
      <polygon points="215,275 235,275 235,355 215,355" fill="url(#bladeBevel)" opacity="0.6" />

      <!-- Khadira Wooden Blade (स्फ्य फलक) with Tapered Sharp Cutting Edge -->
      <!-- Spine (Straight Upper Edge) and Chiseled Sharp Lower Cutting Edge -->
      <path d="M 235,292 
               L 710,292 
               C 745,294, 780,305, 805,315
               C 775,325, 735,338, 710,340
               L 235,338
               Z" 
            fill="url(#khadiraSword)" stroke="#190702" stroke-width="3.5" />

      <!-- Beveled Blade Face & Cutting Edge Glint -->
      <polygon points="235,294 710,294 805,315 710,315 235,315" fill="url(#bladeBevel)" opacity="0.85" />
      <line x1="235" y1="315" x2="805" y2="315" stroke="#FFAE85" stroke-width="2" opacity="0.9" />

      <!-- Sharp Lower Chisel Edge (उल्लेखन धार) -->
      <path d="M 235,338 L 710,340 C 735,338, 775,325, 805,315" stroke="#FFAE85" stroke-width="2.5" fill="none" opacity="0.8" />

      <!-- Wood Grain of Ancient Dense Khadira Core -->
      <g stroke="#C48255" stroke-width="0.9" fill="none" opacity="0.45">
        <path d="M 260,302 C 380,302, 540,303, 680,302" />
        <path d="M 270,328 C 390,328, 550,327, 690,328" stroke="#190702" stroke-width="1.8" opacity="0.7" />
      </g>

      <!-- Three Auspicious Carved Lines on Blade representing the 3 Rekhas of Kunda -->
      <line x1="320" y1="300" x2="320" y2="330" stroke="#FF4D4D" stroke-width="2" />
      <line x1="335" y1="299" x2="335" y2="331" stroke="#FF4D4D" stroke-width="2" />
      <line x1="350" y1="298" x2="350" y2="332" stroke="#FF4D4D" stroke-width="2" />
    </g>

    <!-- Dimension Marker Arrows -->
    <g opacity="0.85">
      <line x1="120" y1="210" x2="805" y2="210" stroke="#805713" stroke-width="2" />
      <polygon points="120,210 135,204 135,216" fill="#805713" />
      <polygon points="805,210 790,204 790,216" fill="#805713" />
      <rect x="360" y="196" width="200" height="26" rx="6" fill="#FFFDF8" stroke="#805713" stroke-width="1.2" />
      <text x="460" y="214" font-family="'Cinzel', 'Noto Serif', serif" font-size="13" font-weight="900" fill="#805713" text-anchor="middle">
        दैर्घ्य: २४ अंगुल (१ अरत्नि)
      </text>
    </g>
  </g>

  <!-- BOTTOM BANNER -->
  <g transform="translate(500, 890)" text-anchor="middle">
    <rect x="-380" y="-45" width="760" height="75" rx="16" fill="#FFF9EB" stroke="#BE123C" stroke-width="2.2" />
    <text y="-20" font-family="'Noto Serif', serif" font-size="16" font-weight="900" fill="#9F1239">
      ✦ अधः-स्थापित पीठ: वायव्य वज्र-षट्कोण यन्त्रपीठ (स्फ्य-प्रतिष्ठा) ✦
    </text>
    <text y="5" font-family="'Noto Serif', serif" font-size="13" font-weight="bold" fill="#881337">
      अङ्कन द्रव्य: सिन्दूर एवं रक्त चन्दन | बीज मन्त्र: "ॐ यं स्फ्याय नमः" | आकृति: षट्कोण एवं वज्राग्र शूल
    </text>
    <text y="24" font-family="'Noto Serif', serif" font-size="11" font-weight="bold" fill="#805713">
      *शतपथ ब्राह्मणम्* १.२.५: "वज्रो वा एष यत्स्फ्यः... वायव्ये मण्डले सादयति"
    </text>
  </g>
</svg>

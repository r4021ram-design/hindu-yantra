<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FFFDF8" />
      <stop offset="60%" stop-color="#F5EBDC" />
      <stop offset="100%" stop-color="#E2D1B3" />
    </radialGradient>

    <!-- Kusha Mat Woven Texture -->
    <linearGradient id="kushaWeave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF4DE" />
      <stop offset="30%" stop-color="#D7E8BC" />
      <stop offset="70%" stop-color="#C2DC9A" />
      <stop offset="100%" stop-color="#A6C878" />
    </linearGradient>

    <pattern id="kushaPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 0,0 L 24,24 M 24,0 L 0,24" stroke="#8CAE5B" stroke-width="0.8" opacity="0.4" />
      <line x1="0" y1="12" x2="24" y2="12" stroke="#6C8E3B" stroke-width="0.6" opacity="0.35" />
      <line x1="12" y1="0" x2="12" y2="24" stroke="#5E7E2F" stroke-width="0.6" opacity="0.35" />
    </pattern>

    <!-- Sacred White Sandalwood Paste (श्वेत चन्दन) for Varuna Yantra -->
    <linearGradient id="chandanPaste" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FFFBEB" />
      <stop offset="80%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#E2D0B3" />
    </linearGradient>

    <radialGradient id="varunaAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#7DD3FC" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.08" />
    </radialGradient>

    <!-- Sacred Copper (ताम्र) with Bevel and Sheen -->
    <linearGradient id="sacredCopper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97757" />
      <stop offset="30%" stop-color="#B85434" />
      <stop offset="60%" stop-color="#8C351B" />
      <stop offset="85%" stop-color="#A84323" />
      <stop offset="100%" stop-color="#541B0B" />
    </linearGradient>

    <linearGradient id="copperRimBevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFAE94" />
      <stop offset="40%" stop-color="#FFD4C7" />
      <stop offset="70%" stop-color="#E0795A" />
      <stop offset="100%" stop-color="#8C2C14" />
    </linearGradient>

    <!-- Sacred Consecrated Brahma Water Pool -->
    <radialGradient id="brahmaWater" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#F0F9FF" />
      <stop offset="25%" stop-color="#BAE6FD" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="85%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#075985" />
    </radialGradient>

    <!-- Sacred Darbha Pavatri Blades -->
    <linearGradient id="pavitriGrass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BEF264" />
      <stop offset="50%" stop-color="#65A30D" />
      <stop offset="100%" stop-color="#365314" />
    </linearGradient>

    <!-- Filters -->
    <filter id="yantraGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="patraDeepShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="8" dy="24" stdDeviation="16" flood-color="#2D1208" flood-opacity="0.55" />
      <feDropShadow dx="2" dy="6" stdDeviation="6" flood-color="#4A180B" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="1000" fill="url(#bgGrad)" />

  <!-- Outer Traditional Temple Border -->
  <rect x="30" y="30" width="940" height="940" rx="24" fill="none" stroke="#C5A059" stroke-width="2" stroke-dasharray="8 6" opacity="0.7" />
  <rect x="42" y="42" width="916" height="916" rx="18" fill="none" stroke="#805713" stroke-width="3" opacity="0.85" />

  <!-- HEADER: Pranita Identity & Dimensions -->
  <g transform="translate(500, 85)" text-anchor="middle">
    <rect x="-240" y="-30" width="480" height="42" rx="21" fill="#805713" stroke="#FDE68A" stroke-width="1.8" />
    <text y="-3" font-family="'Cinzel', 'Noto Serif', serif" font-size="18" font-weight="900" fill="#FFFDF8" letter-spacing="2">
      ॥ प्रणीता पात्रम् • वारण काष्ठ / ताम्र ॥
    </text>
    <text y="32" font-family="'Noto Serif', serif" font-size="14" font-weight="bold" fill="#6A1B07">
      मानक चतुरस्र प्रमाण: ८ अंगुल लम्बाई × ४ अंगुल चौड़ाई × ३ अंगुल गहराई | ब्रह्म-वारि कलश
    </text>
  </g>

  <!-- ============================================================== -->
  <!-- 1. SACRED KUSHA MAT BED (कुश-आस्तरण वेदी) -->
  <!-- ============================================================== -->
  <g transform="translate(100, 160)">
    <rect x="0" y="0" width="800" height="640" rx="28" fill="url(#kushaWeave)" stroke="#558B2F" stroke-width="3" />
    <rect x="0" y="0" width="800" height="640" rx="28" fill="url(#kushaPattern)" />
    <rect x="12" y="12" width="776" height="616" rx="20" fill="none" stroke="#33691E" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6" />

    <!-- Akshata Grains on Mat -->
    <g fill="#FFFDF5" stroke="#D97706" stroke-width="0.6" opacity="0.85">
      <ellipse cx="80" cy="85" rx="3.5" ry="1.8" transform="rotate(25 80 85)" />
      <ellipse cx="95" cy="80" rx="3.8" ry="1.7" transform="rotate(-30 95 80)" />
      <ellipse cx="715" cy="85" rx="3.6" ry="1.8" transform="rotate(40 715 85)" />
      <ellipse cx="725" cy="545" rx="3.7" ry="1.8" transform="rotate(15 725 545)" />
      <ellipse cx="85" cy="555" rx="3.5" ry="1.7" transform="rotate(-20 85 555)" />
    </g>

    <!-- ============================================================== -->
    <!-- 2. UNDERLYING YANTRA: वारुण अष्टदल पद्म मण्डल (Varuna Mandala) -->
    <!-- ============================================================== -->
    <!-- Sharadatilakam Patala 4: "वारुणं पद्ममण्डलं चतुरस्रं सुशोभनम्... वं-बीजेन समायुक्तं प्रणीतायाः पदं भवेत्" -->
    <g id="underlying-yantra-pranita" transform="translate(400, 320)" filter="url(#yantraGlowFilter)">
      <!-- Luminous Aura -->
      <circle cx="0" cy="0" r="235" fill="url(#varunaAura)" opacity="0.45" />

      <!-- Square Chaturasra Bhupura (चतुरस्र भूपुर) drawn in White Sandalwood Paste -->
      <rect x="-210" y="-190" width="420" height="380" rx="16" fill="#F0FDF4" stroke="#0284C7" stroke-width="3" opacity="0.85" />
      <rect x="-195" y="-175" width="390" height="350" rx="12" fill="none" stroke="#0284C7" stroke-width="1.8" stroke-dasharray="8 4" opacity="0.75" />

      <!-- Consecrated Circle -->
      <circle cx="0" cy="0" r="155" fill="#F8FAFC" stroke="#0369A1" stroke-width="2.5" />

      <!-- Ashtadala Lotus (अष्टदल पद्म) drawn in Chandan -->
      <g stroke="#0284C7" stroke-width="1.6" fill="#FFFFFF" opacity="0.95">
        <path d="M 0 -155 Q 35 -95, 0 -45 Q -35 -95, 0 -155 Z" />
        <path d="M 0 155 Q 35 95, 0 45 Q -35 95, 0 155 Z" />
        <path d="M -155 0 Q -95 35, -45 0 Q -95 -35, -155 0 Z" />
        <path d="M 155 0 Q 95 35, 45 0 Q 95 -35, 155 0 Z" />
        <path d="M -110 -110 Q -65 -65, -32 -32 Q -65 -95, -110 -110 Z" />
        <path d="M 110 110 Q 65 65, 32 32 Q 65 95, 110 110 Z" />
        <path d="M 110 -110 Q 65 -65, 32 -32 Q 95 -65, 110 -110 Z" />
        <path d="M -110 110 Q -65 65, -32 32 Q -95 65, -110 110 Z" />
      </g>

      <!-- Water Waves Geometry (वारुण तरंग) inside Lotus -->
      <circle cx="0" cy="0" r="58" fill="#E0F2FE" stroke="#0284C7" stroke-width="2" />
      <path d="M -40,-12 Q -20,-24 0,-12 Q 20,0 40,-12" stroke="#0284C7" stroke-width="2" fill="none" opacity="0.8" />
      <path d="M -40,12 Q -20,0 0,12 Q 20,24 40,12" stroke="#0284C7" stroke-width="2" fill="none" opacity="0.8" />

      <!-- Central Sacred Beeja Mantra: वं (Varuna Beeja) in Brilliant Blue-Gold -->
      <text x="0" y="8" font-family="'Noto Serif', serif" font-size="38" font-weight="900" fill="#0369A1" text-anchor="middle" letter-spacing="1">
        वं
      </text>

      <!-- Pitha Label -->
      <text x="0" y="165" font-family="'Noto Serif', serif" font-size="13" font-weight="900" fill="#0369A1" text-anchor="middle">
        वारुण अष्टदल पद्म मण्डल (श्वेत चन्दन एवं अक्षत निर्मित)
      </text>
    </g>

    <!-- ============================================================== -->
    <!-- 3. REALISTIC RECTANGULAR PRANITA PATRA RESTING ON TOP -->
    <!-- ============================================================== -->
    <!-- Perspective rectangular box vessel (8 x 4 x 3 Angulas) -->
    <g id="pranita-vessel" filter="url(#patraDeepShadow)">
      
      <!-- Contact Shadow onto Yantra -->
      <ellipse cx="400" cy="335" rx="270" ry="85" fill="#031C2D" opacity="0.5" filter="url(#yantraGlowFilter)" />

      <!-- Exterior Front & Side 3D Copper Wall -->
      <path d="M 140,245 
               L 660,245 
               C 685,245, 700,265, 688,290
               L 620,430
               C 610,448, 590,455, 565,455
               L 235,455
               C 210,455, 190,448, 180,430
               L 112,290
               C 100,265, 115,245, 140,245
               Z" 
            fill="url(#sacredCopper)" stroke="#381005" stroke-width="3.5" />

      <!-- Copper Body Texture Highlights and Engravings -->
      <line x1="165" y1="290" x2="635" y2="290" stroke="#FFAE94" stroke-width="2" opacity="0.85" />
      <line x1="205" y1="420" x2="595" y2="420" stroke="#381005" stroke-width="2.5" opacity="0.9" />

      <!-- Traditional Lotus Petals carved along vessel base -->
      <g fill="#D97757" stroke="#541B0B" stroke-width="1.2" opacity="0.9">
        <path d="M 245,455 C 265,442, 285,442, 305,455 Z" />
        <path d="M 305,455 C 325,442, 345,442, 365,455 Z" />
        <path d="M 365,455 C 385,442, 405,442, 425,455 Z" />
        <path d="M 425,455 C 445,442, 465,442, 485,455 Z" />
        <path d="M 485,455 C 505,442, 525,442, 545,455 Z" />
      </g>

      <!-- Top Flanged Rim Bevel (ऊपरी मुख पट्टिका) -->
      <polygon points="135,245 665,245 635,285 165,285" fill="url(#copperRimBevel)" stroke="#381005" stroke-width="2" />

      <!-- Inner Cavity with Consecrated Brahma Water Pool -->
      <polygon points="168,285 632,285 585,410 215,410" fill="url(#brahmaWater)" stroke="#0369A1" stroke-width="2.5" />

      <!-- Translucent Water Surface Shimmer & Caustics -->
      <ellipse cx="400" cy="335" rx="170" ry="38" fill="#BAE6FD" opacity="0.5" />
      <ellipse cx="380" cy="325" rx="90" ry="18" fill="#FFFFFF" opacity="0.75" />
      <path d="M 270,315 C 340,305, 460,305, 530,315" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.7" />
      <path d="M 290,345 C 360,340, 440,340, 510,345" stroke="#38BDF8" stroke-width="2.5" fill="none" opacity="0.8" />

      <!-- Two Sacred Darbha Pavitris Floating in the Water (दो कुश-पवित्री) -->
      <!-- Pavitri 1 (South-West to North-East Diagonal) -->
      <g>
        <path d="M 260,365 C 330,335, 410,315, 520,298" stroke="url(#pavitriGrass)" stroke-width="6" stroke-linecap="round" fill="none" />
        <circle cx="390" cy="328" r="9" fill="#FACC15" stroke="#4D7C0F" stroke-width="1.8" />
        <!-- Twin Split Tips (द्व्यग्र पवित्री) -->
        <path d="M 520,298 C 545,292, 570,288, 590,282" stroke="url(#pavitriGrass)" stroke-width="3.5" fill="none" stroke-linecap="round" />
        <path d="M 520,298 C 545,302, 570,300, 585,296" stroke="url(#pavitriGrass)" stroke-width="3" fill="none" stroke-linecap="round" />
      </g>

      <!-- Pavitri 2 (North-West to South-East Counter Diagonal) -->
      <g>
        <path d="M 280,295 C 350,315, 430,338, 530,368" stroke="url(#pavitriGrass)" stroke-width="5.5" stroke-linecap="round" fill="none" />
        <circle cx="410" cy="334" r="8" fill="#FACC15" stroke="#4D7C0F" stroke-width="1.8" />
        <path d="M 530,368 C 555,375, 575,382, 595,388" stroke="url(#pavitriGrass)" stroke-width="3.5" fill="none" stroke-linecap="round" />
        <path d="M 530,368 C 555,368, 575,370, 590,374" stroke="url(#pavitriGrass)" stroke-width="3" fill="none" stroke-linecap="round" />
      </g>
    </g>

    <!-- Dimension Marker Arrows -->
    <g opacity="0.85">
      <line x1="135" y1="215" x2="665" y2="215" stroke="#805713" stroke-width="2" />
      <polygon points="135,215 150,209 150,221" fill="#805713" />
      <polygon points="665,215 650,209 650,221" fill="#805713" />
      <rect x="300" y="201" width="200" height="26" rx="6" fill="#FFFDF8" stroke="#805713" stroke-width="1.2" />
      <text x="400" y="219" font-family="'Cinzel', 'Noto Serif', serif" font-size="13" font-weight="900" fill="#805713" text-anchor="middle">
        लम्बाई: ८ अंगुल (६ इंच)
      </text>
    </g>
  </g>

  <!-- BOTTOM BANNER -->
  <g transform="translate(500, 890)" text-anchor="middle">
    <rect x="-380" y="-45" width="760" height="75" rx="16" fill="#FFF9EB" stroke="#0284C7" stroke-width="2.2" />
    <text y="-20" font-family="'Noto Serif', serif" font-size="16" font-weight="900" fill="#0369A1">
      ✦ अधः-स्थापित पीठ: वारुण अष्टदल पद्म मण्डल (ब्रह्मवारि-प्रतिष्ठा) ✦
    </text>
    <text y="5" font-family="'Noto Serif', serif" font-size="13" font-weight="bold" fill="#0F766E">
      अङ्कन द्रव्य: श्वेत चन्दन एवं अक्षत | बीज मन्त्र: "ॐ वं वरुणाय नमः" | आकृति: चतुरस्र भूपुर एवं अष्टदल कमल
    </text>
    <text y="24" font-family="'Noto Serif', serif" font-size="11" font-weight="bold" fill="#805713">
      *कात्यायन श्रौतसूत्रम्* १.३: "वारुणे मण्डले प्रणीतां सादयति... पवित्रेण समन्वारब्धासु"
    </text>
  </g>
</svg>

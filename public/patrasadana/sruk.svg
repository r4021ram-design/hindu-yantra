<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="60%" stop-color="#F7EEDF" />
      <stop offset="100%" stop-color="#EADBBE" />
    </radialGradient>

    <!-- Palasha Sacred Wood Gradient -->
    <linearGradient id="palashaWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C25A2A" />
      <stop offset="25%" stop-color="#9A3816" />
      <stop offset="50%" stop-color="#6F240A" />
      <stop offset="75%" stop-color="#9A3816" />
      <stop offset="100%" stop-color="#4D1604" />
    </linearGradient>

    <!-- Wood Grain Texture -->
    <linearGradient id="woodHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97736" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#7A2808" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3A1204" stop-opacity="0.9" />
    </linearGradient>

    <!-- Sacred Ghee Pool Glow -->
    <radialGradient id="gheeGlow" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="40%" stop-color="#FCD34D" />
      <stop offset="75%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </radialGradient>

    <!-- Gold Inlay -->
    <linearGradient id="sacredGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FFF2A3" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="patraShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="8" dy="18" stdDeviation="14" flood-color="#421E06" flood-opacity="0.38" />
    </feDropShadow>
    <filter id="innerDepth">
      <feOffset dx="3" dy="5" />
      <feGaussianBlur stdDeviation="4" result="offset-blur" />
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse" />
      <feFlood flood-color="#2D0B02" flood-opacity="0.75" result="color" />
      <feComposite operator="in" in="color" in2="inverse" result="shadow" />
      <feComposite operator="over" in="shadow" in2="SourceGraphic" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#bgGrad)" />

  <!-- Outer Sacred Geometry Frame -->
  <rect x="35" y="35" width="930" height="930" rx="28" fill="none" stroke="#C5A059" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />
  <rect x="50" y="50" width="900" height="900" rx="22" fill="none" stroke="#805713" stroke-width="3" opacity="0.8" />
  <circle cx="500" cy="500" r="410" fill="none" stroke="#C5A059" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.45" />

  <!-- Dimension Guide Lines & Annotation -->
  <g opacity="0.7">
    <!-- Center Guideline -->
    <line x1="160" y1="500" x2="840" y2="500" stroke="#805713" stroke-width="1" stroke-dasharray="4 4" />
    <!-- Dimension arrows -->
    <line x1="150" y1="210" x2="850" y2="210" stroke="#805713" stroke-width="1.5" />
    <path d="M 150 210 L 165 204 L 165 216 Z" fill="#805713" />
    <path d="M 850 210 L 835 204 L 835 216 Z" fill="#805713" />
    <text x="500" y="195" font-family="'Cinzel', 'Noto Serif', serif" font-size="16" font-weight="bold" fill="#805713" text-anchor="middle" letter-spacing="1">
      मानक प्रमाण: १ हस्त (२४ अंगुल • १८ इंच • ४५.७ सेमी)
    </text>
  </g>

  <!-- SRUK BODY (Horizontal Layout from Left Handle to Right Elephant-Spout Bowl) -->
  <g filter="url(#patraShadow)">
    
    <!-- Danda (Long Handle) -->
    <!-- Handle Tail Ring (पवित्र कङ्कण / मुकुट) -->
    <ellipse cx="180" cy="500" rx="32" ry="45" fill="url(#palashaWood)" stroke="#521503" stroke-width="3" />
    <ellipse cx="180" cy="500" rx="16" ry="24" fill="#EADBBE" stroke="#4A1303" stroke-width="2" />

    <!-- Handle Shaft (Danda) -->
    <path d="M 210 482 
             C 320 480, 480 478, 620 472
             L 620 528
             C 480 522, 320 520, 210 518
             Z" 
          fill="url(#woodHighlight)" stroke="#4A1303" stroke-width="3.5" />

    <!-- Wood grain details on shaft -->
    <path d="M 240 488 C 360 486, 500 484, 600 480" stroke="#E28743" stroke-width="1.5" fill="none" opacity="0.6" />
    <path d="M 250 512 C 370 514, 510 516, 600 520" stroke="#3D1002" stroke-width="2" fill="none" opacity="0.7" />
    <path d="M 280 500 C 390 499, 490 499, 580 498" stroke="#F59E0B" stroke-width="1.2" fill="none" opacity="0.5" />

    <!-- Gold Embossed Rings on Handle -->
    <rect x="290" y="479" width="14" height="42" rx="4" fill="url(#sacredGold)" stroke="#684705" stroke-width="1" />
    <rect x="420" y="477" width="16" height="46" rx="4" fill="url(#sacredGold)" stroke="#684705" stroke-width="1" />
    <rect x="550" y="474" width="18" height="52" rx="4" fill="url(#sacredGold)" stroke="#684705" stroke-width="1" />

    <!-- Sruk Main Receptacle / Head (बिल - Bowl) -->
    <!-- Outer Contour with Elephant Trunk Spout (हस्त्याकार शुण्डिका) -->
    <path d="M 610 472
             C 630 440, 680 410, 750 410
             C 810 410, 850 445, 850 490
             C 850 500, 845 508, 835 512
             C 860 515, 875 525, 880 540
             C 885 558, 865 575, 830 580
             C 795 585, 750 570, 715 548
             C 660 544, 625 532, 610 528
             Z"
          fill="url(#palashaWood)" stroke="#421203" stroke-width="4" filter="url(#innerDepth)" />

    <!-- Inner Cavity for Ghee (पुष्कर / खात) -->
    <path d="M 645 470
             C 670 445, 720 435, 770 435
             C 815 435, 832 460, 830 488
             C 815 498, 770 515, 720 522
             C 670 522, 650 495, 645 470
             Z"
          fill="url(#gheeGlow)" stroke="#78350F" stroke-width="2.5" />

    <!-- Elephant Trunk Spout Channel (शुण्डिका निर्गम मार्ग) -->
    <path d="M 765 478
             C 800 482, 835 500, 845 525
             C 850 538, 840 548, 820 550
             C 795 552, 765 535, 750 518
             Z"
          fill="#D97706" stroke="#451A03" stroke-width="1.5" opacity="0.9" />

    <!-- Flowing Golden Ghee Stream from Spout (वसोर्धारा बिन्दु) -->
    <circle cx="855" cy="545" r="7" fill="#FDE047" stroke="#B45309" stroke-width="1" />
    <path d="M 855 552 C 865 575, 870 595, 868 620 C 866 630, 860 635, 856 635 C 852 635, 848 625, 850 610 C 852 590, 852 565, 855 552 Z" 
          fill="url(#sacredGold)" opacity="0.85" />
    <circle cx="862" cy="650" r="5" fill="#FDE047" />
    <circle cx="864" cy="670" r="3.5" fill="#FDE047" />

  </g>

  <!-- Sacred Vedic Inscriptions and Details -->
  <!-- Deity / Tree Attribution -->
  <g transform="translate(500, 750)" text-anchor="middle">
    <!-- Title -->
    <text y="0" font-family="'Cinzel', 'Noto Serif', serif" font-size="34" font-weight="900" fill="#6A1B07" letter-spacing="2">
      पलाश स्रुक् (SRUK)
    </text>
    <text y="30" font-family="'Noto Serif', serif" font-size="18" font-weight="bold" fill="#805713">
      ब्रह्मवृक्ष पलाश काष्ठ निर्मित • वसोर्धारा एवं पूर्णाहुति महापात्र
    </text>

    <!-- Shastric Citation -->
    <rect x="-380" y="55" width="760" height="95" rx="14" fill="#F5E8D3" stroke="#C5A059" stroke-width="1.5" opacity="0.9" />
    <text y="85" font-family="'Noto Serif', serif" font-size="16" font-style="italic" fill="#521706">
      "जुहूरसि घृताची नाम्ना प्रियेण नाम्ना प्रियं सद आसीद ॥"
    </text>
    <text y="115" font-family="'Noto Serif', serif" font-size="13" font-weight="600" fill="#7D6B57">
      — शतपथ ब्राह्मणम् १.३.२ • हस्तिमुख शुण्डिका युक्त १ हस्त प्रमाण
    </text>
  </g>

  <!-- Cardinal Coordinates & Orientation Tag -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="160" height="42" rx="10" fill="#EFE3CB" stroke="#805713" stroke-width="1.5" />
    <text x="80" y="26" font-family="monospace" font-size="13" font-weight="bold" fill="#805713" text-anchor="middle">
      उदीची (उत्तर वेदी)
    </text>
  </g>
  <g transform="translate(740, 100)">
    <rect x="0" y="0" width="160" height="42" rx="10" fill="#EFE3CB" stroke="#805713" stroke-width="1.5" />
    <text x="80" y="26" font-family="monospace" font-size="13" font-weight="bold" fill="#805713" text-anchor="middle">
      प्राची-मुख (पूर्व)
    </text>
  </g>

</svg>

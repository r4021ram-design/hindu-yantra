<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FFFDF8" />
      <stop offset="60%" stop-color="#F5EBDC" />
      <stop offset="100%" stop-color="#E2D1B3" />
    </radialGradient>

    <!-- Kusha Mat Woven Texture -->
    <linearGradient id="kushaWeave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF4DE" />
      <stop offset="30%" stop-color="#D7E8BC" />
      <stop offset="70%" stop-color="#C2DC9A" />
      <stop offset="100%" stop-color="#A6C878" />
    </linearGradient>

    <pattern id="kushaPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 0,0 L 24,24 M 24,0 L 0,24" stroke="#8CAE5B" stroke-width="0.8" opacity="0.4" />
      <line x1="0" y1="12" x2="24" y2="12" stroke="#6C8E3B" stroke-width="0.6" opacity="0.35" />
      <line x1="12" y1="0" x2="12" y2="24" stroke="#5E7E2F" stroke-width="0.6" opacity="0.35" />
    </pattern>

    <!-- Sacred Red Kumkum / Rakta-Chandana Paste for Underlying Agni Yantra -->
    <linearGradient id="kumkumPaste" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4D" />
      <stop offset="40%" stop-color="#DC2626" />
      <stop offset="75%" stop-color="#B91C1C" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </linearGradient>

    <radialGradient id="kumkumGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F87171" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#DC2626" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#991B1B" stop-opacity="0.1" />
    </radialGradient>

    <!-- Palasha Sacred Wood (Flame of the Forest - Butea monosperma) -->
    <linearGradient id="palashaWood" x1="0%" y1="0%" x2="100%" y2="40%">
      <stop offset="0%" stop-color="#C85A24" />
      <stop offset="20%" stop-color="#A73E12" />
      <stop offset="45%" stop-color="#7B2909" />
      <stop offset="70%" stop-color="#9E3A10" />
      <stop offset="88%" stop-color="#5E1E05" />
      <stop offset="100%" stop-color="#3D1303" />
    </linearGradient>

    <linearGradient id="woodSpecular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA875" stop-opacity="0.6" />
      <stop offset="35%" stop-color="#C85A24" stop-opacity="0.1" />
      <stop offset="85%" stop-color="#3D1303" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#240A01" stop-opacity="0.9" />
    </linearGradient>

    <!-- Sacred Molten Cow Ghee Glow -->
    <radialGradient id="moltenGhee" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="30%" stop-color="#FDE047" />
      <stop offset="65%" stop-color="#EAB308" />
      <stop offset="90%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#854D0E" />
    </radialGradient>

    <!-- Gold Accents -->
    <linearGradient id="sacredGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="80%" stop-color="#92400E" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Filters for Depth and Realism -->
    <filter id="yantraGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="patraDeepShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="8" dy="24" stdDeviation="16" flood-color="#260C03" flood-opacity="0.55" />
      <feDropShadow dx="2" dy="6" stdDeviation="6" flood-color="#3D1507" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="1000" fill="url(#bgGrad)" />

  <!-- Outer Traditional Temple Border -->
  <rect x="30" y="30" width="940" height="940" rx="24" fill="none" stroke="#C5A059" stroke-width="2" stroke-dasharray="8 6" opacity="0.7" />
  <rect x="42" y="42" width="916" height="916" rx="18" fill="none" stroke="#805713" stroke-width="3" opacity="0.85" />

  <!-- HEADER: Vessel Identity & Scriptural Measure -->
  <g transform="translate(500, 85)" text-anchor="middle">
    <rect x="-240" y="-30" width="480" height="42" rx="21" fill="#805713" stroke="#FDE68A" stroke-width="1.8" />
    <text y="-3" font-family="'Cinzel', 'Noto Serif', serif" font-size="18" font-weight="900" fill="#FFFDF8" letter-spacing="2">
      ॥ स्रुक् पात्रम् • पलाश काष्ठ ॥
    </text>
    <text y="32" font-family="'Noto Serif', serif" font-size="14" font-weight="bold" fill="#6A1B07">
      मानक प्रमाण: १ हस्त (२४ अंगुल • १८ इंच • ४५.७ सेमी) | मुख: गजोष्ठ (हस्त्याकार पुट)
    </text>
  </g>

  <!-- ============================================================== -->
  <!-- 1. SACRED KUSHA MAT BED (कुश-आस्तरण वेदी) -->
  <!-- ============================================================== -->
  <g transform="translate(100, 160)">
    <!-- Woven Mat Base with Drop Shadow -->
    <rect x="0" y="0" width="800" height="640" rx="28" fill="url(#kushaWeave)" stroke="#558B2F" stroke-width="3" />
    <rect x="0" y="0" width="800" height="640" rx="28" fill="url(#kushaPattern)" />
    
    <!-- Mat Border Trim (गोपीचन्दन एवं दर्भ ग्रन्थि) -->
    <rect x="12" y="12" width="776" height="616" rx="20" fill="none" stroke="#33691E" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6" />
    
    <!-- Scattered Sacred Akshata (अक्षत - Consecrated Rice Grains) on Altar -->
    <g fill="#FFFDF5" stroke="#D97706" stroke-width="0.6" opacity="0.85">
      <ellipse cx="70" cy="80" rx="3.5" ry="1.8" transform="rotate(25 70 80)" />
      <ellipse cx="80" cy="74" rx="3.8" ry="1.7" transform="rotate(-40 80 74)" />
      <ellipse cx="65" cy="92" rx="3.4" ry="1.6" transform="rotate(15 65 92)" />
      <ellipse cx="720" cy="90" rx="3.6" ry="1.8" transform="rotate(35 720 90)" />
      <ellipse cx="735" cy="82" rx="3.8" ry="1.7" transform="rotate(-20 735 82)" />
      <ellipse cx="710" cy="560" rx="3.7" ry="1.8" transform="rotate(60 710 560)" />
      <ellipse cx="80" cy="550" rx="3.6" ry="1.7" transform="rotate(-30 80 550)" />
      <ellipse cx="95" cy="565" rx="3.8" ry="1.8" transform="rotate(10 95 565)" />
    </g>

    <!-- ============================================================== -->
    <!-- 2. UNDERLYING YANTRA (पात्र के नीचे बना आग्नेय त्रिकोण यन्त्रपीठ) -->
    <!-- ============================================================== -->
    <!-- Sharadatilakam Patala 4: "आग्नेयं तु त्रिकोणं स्यात्... रं-बीजेन समन्वितम्" -->
    <g id="underlying-yantra-sruk" transform="translate(400, 320)" filter="url(#yantraGlowFilter)">
      <!-- Radiance Glow Aura behind Yantra -->
      <circle cx="0" cy="0" r="230" fill="url(#kumkumGlow)" opacity="0.35" />

      <!-- Outer Consecrated Circle with Lotus Border -->
      <circle cx="0" cy="0" r="210" fill="none" stroke="#B91C1C" stroke-width="2.5" stroke-dasharray="8 4" opacity="0.7" />
      <circle cx="0" cy="0" r="195" fill="#FEF2F2" stroke="#DC2626" stroke-width="3" opacity="0.85" />

      <!-- Agni Trikona (अग्नि त्रिकोण) drawn in Vermillion/Kumkum -->
      <!-- Equilateral Triangle pointing upwards with double sacred boundary -->
      <polygon points="0,-165 142,85 -142,85" fill="#FEE2E2" stroke="#991B1B" stroke-width="5" />
      <polygon points="0,-140 120,70 -120,70" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="6 3" />

      <!-- 3 Sacred Swastikas at the 3 Vertices of the Triangle -->
      <g stroke="#991B1B" stroke-width="2.2" stroke-linecap="square" fill="none" opacity="0.85">
        <!-- Top Apex Swastika -->
        <g transform="translate(0, -115) scale(0.65)">
          <line x1="-12" y1="0" x2="12" y2="0" />
          <line x1="0" y1="-12" x2="0" y2="12" />
          <line x1="12" y1="0" x2="12" y2="8" />
          <line x1="-12" y1="0" x2="-12" y2="-8" />
          <line x1="0" y1="12" x2="-8" y2="12" />
          <line x1="0" y1="-12" x2="8" y2="-12" />
        </g>
        <!-- Bottom-Right Swastika -->
        <g transform="translate(85, 45) scale(0.65)">
          <line x1="-12" y1="0" x2="12" y2="0" />
          <line x1="0" y1="-12" x2="0" y2="12" />
          <line x1="12" y1="0" x2="12" y2="8" />
          <line x1="-12" y1="0" x2="-12" y2="-8" />
          <line x1="0" y1="12" x2="-8" y2="12" />
          <line x1="0" y1="-12" x2="8" y2="-12" />
        </g>
        <!-- Bottom-Left Swastika -->
        <g transform="translate(-85, 45) scale(0.65)">
          <line x1="-12" y1="0" x2="12" y2="0" />
          <line x1="0" y1="-12" x2="0" y2="12" />
          <line x1="12" y1="0" x2="12" y2="8" />
          <line x1="-12" y1="0" x2="-12" y2="-8" />
          <line x1="0" y1="12" x2="-8" y2="12" />
          <line x1="0" y1="-12" x2="8" y2="-12" />
        </g>
      </g>

      <!-- Three Fire Flame Tongues radiating outward (अग्नि-शिखा) -->
      <path d="M 0,-165 Q 12,-185 0,-200 Q -12,-185 0,-165 Z" fill="#DC2626" />
      <path d="M 142,85 Q 165,95 175,115 Q 150,110 142,85 Z" fill="#DC2626" />
      <path d="M -142,85 Q -165,95 -175,115 Q -150,110 -142,85 Z" fill="#DC2626" />

      <!-- Sacred Akshata consecrated in the Yantra -->
      <circle cx="-50" cy="15" r="3" fill="#FFFDF5" stroke="#991B1B" stroke-width="0.8" />
      <circle cx="50" cy="15" r="3" fill="#FFFDF5" stroke="#991B1B" stroke-width="0.8" />
      <circle cx="0" cy="-60" r="3" fill="#FFFDF5" stroke="#991B1B" stroke-width="0.8" />

      <!-- Sacred Agni Beeja Mantra (रं) in Vermillion Calligraphy -->
      <g transform="translate(0, 15)">
        <circle cx="0" cy="-10" r="36" fill="#FEE2E2" stroke="#991B1B" stroke-width="1.8" />
        <text x="0" y="4" font-family="'Noto Serif', serif" font-size="36" font-weight="900" fill="#991B1B" text-anchor="middle" letter-spacing="1">
          रं
        </text>
        <text x="0" y="38" font-family="'Cinzel', 'Noto Serif', serif" font-size="11" font-weight="bold" fill="#7F1D1D" text-anchor="middle" letter-spacing="1">
          ॥ वह्नि-बीजम् ॥
        </text>
      </g>

      <!-- Label of the Underlying Yantra right on the pitha -->
      <text x="0" y="165" font-family="'Noto Serif', serif" font-size="13" font-weight="900" fill="#991B1B" text-anchor="middle" letter-spacing="0.5">
        आग्नेय त्रिकोण यन्त्रपीठ (रक्त कुङ्कुम/चन्दन निर्मित)
      </text>
    </g>

    <!-- ============================================================== -->
    <!-- 3. REALISTIC SRUK VESSEL RESTING ON TOP OF THE YANTRA -->
    <!-- ============================================================== -->
    <!-- 1 Hasta = 24 Angulas (~45.7 cm) long ladle with Gajoshtha snout -->
    <g id="sruk-vessel" filter="url(#patraDeepShadow)">
      
      <!-- Contact Shadow onto Yantra Surface -->
      <ellipse cx="400" cy="330" rx="310" ry="24" fill="#1C0902" opacity="0.45" filter="url(#yantraGlowFilter)" />

      <!-- Handle End Crown / Ring (पवित्र कङ्कण / मुकुट दण्ड-मूल) -->
      <g transform="translate(120, 315)">
        <ellipse cx="0" cy="0" rx="26" ry="38" fill="url(#palashaWood)" stroke="#3D1303" stroke-width="3" />
        <ellipse cx="0" cy="0" rx="12" ry="18" fill="#A6C878" stroke="#240A01" stroke-width="2" opacity="0.8" />
        <ellipse cx="0" cy="0" rx="26" ry="38" fill="url(#woodSpecular)" />
      </g>

      <!-- Long Wooden Handle Shaft (स्रुक्-दण्ड) with organic carved taper -->
      <path d="M 142,300 
               C 260,298, 430,295, 540,288
               C 565,286, 580,284, 595,282
               L 595,348
               C 580,346, 565,344, 540,342
               C 430,335, 260,332, 142,330
               Z" 
            fill="url(#palashaWood)" stroke="#3D1303" stroke-width="3" />
      <!-- Top Specular Highlight on Curved Handle -->
      <path d="M 145,302 C 260,300, 430,297, 590,285 L 590,305 C 430,314, 260,316, 145,316 Z"
            fill="url(#woodSpecular)" opacity="0.75" />

      <!-- Natural Wood Grain Striations & Carved Chisel Marks -->
      <g fill="none" stroke="#FF9666" stroke-width="1.2" opacity="0.55">
        <path d="M 160,307 C 280,305, 420,302, 570,292" />
        <path d="M 170,323 C 290,322, 430,321, 560,326" stroke="#260C03" stroke-width="2" opacity="0.75" />
        <path d="M 220,314 C 340,312, 460,311, 540,311" stroke="#FDE68A" stroke-width="0.9" opacity="0.45" />
      </g>

      <!-- Sacred Gold Embossed Bands (दण्ड-वलय / कङ्कण) -->
      <g fill="url(#sacredGold)" stroke="#522A04" stroke-width="1.2">
        <rect x="230" y="296" width="12" height="36" rx="3" />
        <rect x="360" y="293" width="14" height="40" rx="3" />
        <rect x="490" y="289" width="15" height="46" rx="3.5" />
      </g>

      <!-- Sruk Bowl Collar (स्रुक्-कण्ठ) -->
      <path d="M 590,282 C 610,278, 625,274, 635,270 L 635,360 C 625,356, 610,352, 590,348 Z" 
            fill="url(#palashaWood)" stroke="#3D1303" stroke-width="2.5" />

      <!-- Deep Oblation Bowl (स्रुक्-पुष्कर / हविर्भाण्ड) - 4 Angulas wide & deep -->
      <ellipse cx="680" cy="315" rx="65" ry="60" fill="url(#palashaWood)" stroke="#3D1303" stroke-width="3.5" />
      <ellipse cx="680" cy="315" rx="65" ry="60" fill="url(#woodSpecular)" opacity="0.8" />

      <!-- Hollow Cavity carved into the wood -->
      <ellipse cx="678" cy="315" rx="52" ry="46" fill="#4A1604" stroke="#240A01" stroke-width="2" />

      <!-- Molten Golden Ghee Pool inside the Bowl -->
      <ellipse cx="676" cy="316" rx="44" ry="38" fill="url(#moltenGhee)" stroke="#A16207" stroke-width="1.5" />
      <!-- Ghee Liquid Specular Reflection Ring -->
      <ellipse cx="666" cy="306" rx="20" ry="12" fill="#FFFFFF" opacity="0.75" />
      <path d="M 648,315 Q 675,302 705,315" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.6" />

      <!-- Elephant-Trunk Pouring Spout (गजोष्ठ / हस्त्याकार प्रणाल) pointing East -->
      <path d="M 725,295 
               C 755,290, 785,292, 805,305
               C 815,312, 815,318, 805,325
               C 785,338, 755,340, 725,335
               Z" 
            fill="url(#palashaWood)" stroke="#3D1303" stroke-width="3" />
      <!-- Spout Channel Grooves where oblation pours smoothly -->
      <path d="M 728,312 L 802,315" stroke="#FDE047" stroke-width="3" stroke-linecap="round" />
      <ellipse cx="803" cy="315" rx="4" ry="6" fill="#FDE047" stroke="#854D0E" stroke-width="1" />

      <!-- Sacred Ghee Droplets (घृत-बिन्दु / संस्रव) at the tip of the spout -->
      <circle cx="818" cy="316" r="4.5" fill="#FACC15" stroke="#854D0E" stroke-width="1" opacity="0.9" />
      <circle cx="828" cy="320" r="3" fill="#FDE047" stroke="#A16207" stroke-width="0.8" opacity="0.8" />
    </g>

    <!-- Dimension Marker Arrows -->
    <g opacity="0.85">
      <line x1="120" y1="210" x2="805" y2="210" stroke="#805713" stroke-width="2" />
      <polygon points="120,210 135,204 135,216" fill="#805713" />
      <polygon points="805,210 790,204 790,216" fill="#805713" />
      <rect x="360" y="196" width="200" height="26" rx="6" fill="#FFFDF8" stroke="#805713" stroke-width="1.2" />
      <text x="460" y="214" font-family="'Cinzel', 'Noto Serif', serif" font-size="13" font-weight="900" fill="#805713" text-anchor="middle">
        सम्पूर्ण दैर्घ्य: २४ अंगुल (१ हस्त)
      </text>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- 4. BOTTOM DEDICATED SACRED YANTRA BANNER -->
  <!-- ============================================================== -->
  <g transform="translate(500, 890)" text-anchor="middle">
    <!-- Pitha Specification Badge -->
    <rect x="-380" y="-45" width="760" height="75" rx="16" fill="#FFF9EB" stroke="#DC2626" stroke-width="2.2" />
    
    <text y="-20" font-family="'Noto Serif', serif" font-size="16" font-weight="900" fill="#991B1B">
      ✦ अधः-स्थापित पीठ: आग्नेय त्रिकोण यन्त्र (वह्नि-मण्डल) ✦
    </text>
    <text y="5" font-family="'Noto Serif', serif" font-size="13" font-weight="bold" fill="#7F1D1D">
      अङ्कन द्रव्य: रक्त कुङ्कुम एवं रक्त चन्दन | बीज मन्त्र: "ॐ रं अग्नये नमः" | आकृति: ऊर्ध्व त्रिकोण एवं स्वस्तिक
    </text>
    <text y="24" font-family="'Noto Serif', serif" font-size="11" font-weight="bold" fill="#805713">
      *शारदातिलकम्* पटल ४: "पात्राणां धारणात्मने लिखेत्पीठे... वह्निजे रं-बीजेन जुहूप्रभृतीनि सादयेत्"
    </text>
  </g>
</svg>
